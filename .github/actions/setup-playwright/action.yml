name: Set up Playwright browsers
description: >
  Restores the Playwright browsers cache, installs Chromium and WebKit with
  their system packages, and saves the cache on trusted events. Needs
  dependencies installed first. `browsers` limits the install to what a job
  runs (the web e2e shards are the only ones that need WebKit).
inputs:
  browsers:
    description: Space-separated Playwright browsers to install.
    default: chromium webkit
runs:
  using: composite
  steps:
    # Keyed on the Playwright version with no restore-keys, so a bump starts clean.
    - name: Resolve Playwright version
      id: playwright
      shell: bash
      working-directory: apps/web
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Restore Playwright browsers cache
      id: cache-playwright
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.browsers }}

    # The .deb files of the system packages are cached too, because the
    # runner's mirror can be slow. The key follows the package list Playwright
    # prints, so a Playwright bump never installs stale packages.
    - name: Resolve apt package list
      id: apt
      if: runner.os == 'Linux'
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: '"$GITHUB_WORKSPACE/scripts/ci/install-playwright.sh" --plan "$BROWSERS" >> "$GITHUB_OUTPUT"'

    - name: Restore apt packages cache
      id: cache-apt
      if: runner.os == 'Linux'
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/playwright-apt-debs
        key: playwright-apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.apt.outputs.apt-packages-hash }}

    # The system packages are installed on a cache hit too. WebKit runs
    # the iPhone-profile specs (`e2e/mobile-document-scroll.spec.ts`).
    - name: Install Playwright browsers
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
        APT_DEB_CACHE_DIR: ${{ runner.temp }}/playwright-apt-debs
      run: '"$GITHUB_WORKSPACE/scripts/ci/install-playwright.sh" "$BROWSERS"'

    # Same trust gate as the cache saves in ci.yml.
    - name: Save Playwright browsers cache
      if: |
        steps.cache-playwright.outputs.cache-hit != 'true' &&
        ((github.event_name != 'pull_request' &&
          github.event_name != 'pull_request_target') ||
         github.event.pull_request.head.repo.full_name == github.repository)
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.browsers }}

    # An empty entry would restore as a hit and stop every later run on this ref
    # from saving the packages (PR 1201's runs on 2026-11-11 saved two).
    - name: Count downloaded apt packages
      id: apt-debs
      if: ${{ !cancelled() && runner.os == 'Linux' }}
      shell: bash
      env:
        DEB_DIR: ${{ runner.temp }}/playwright-apt-debs
      run: |
        n=0
        for f in "$DEB_DIR"/*.deb; do [ -e "$f" ] && n=$((n + 1)); done
        echo "count=$n" >> "$GITHUB_OUTPUT"

    # Saved even when the install failed, so the next run starts with what this
    # one downloaded. Same trust gate as the saves above.
    - name: Save apt packages cache
      if: |
        !cancelled() && runner.os == 'Linux' &&
        steps.cache-apt.outputs.cache-hit != 'true' &&
        steps.apt-debs.outputs.count != '0' &&
        ((github.event_name != 'pull_request' &&
          github.event_name != 'pull_request_target') ||
         github.event.pull_request.head.repo.full_name == github.repository)
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/playwright-apt-debs
        key: playwright-apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.apt.outputs.apt-packages-hash }}
