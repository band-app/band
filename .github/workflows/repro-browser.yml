name: Repro worker browser test (scratch, delete before merge)
on:
  pull_request:
    branches: [main]
jobs:
  repro:
    name: repro warm=${{ matrix.warm }} #${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        warm: [false, true]
        n: [1, 2, 3, 4, 5, 6]
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
      BAND_CHROMIUM_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-rust
      - uses: ./.github/actions/setup-playwright
      - name: Which Chromium the test finds
        run: ls -la /usr/bin/google-chrome* /usr/bin/chromium* 2>&1 | head; nproc; free -m | head -2
      - name: Warm Chromium
        if: matrix.warm
        run: |
          s=$(date +%s.%N)
          /usr/bin/google-chrome --headless=new --no-sandbox --disable-gpu --dump-dom about:blank > /dev/null 2>&1 || true
          echo "warmup took $(echo "$(date +%s.%N) - $s" | bc) s"
      - name: Worker browser test
        run: |
          s=$(date +%s.%N)
          pnpm --filter @band-app/worker exec node --import tsx --test --test-concurrency=1 --test-timeout=90000 --test-force-exit tests/browser.test.ts
          echo "test took $(echo "$(date +%s.%N) - $s" | bc) s"
