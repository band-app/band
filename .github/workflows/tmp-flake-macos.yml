# TEMPORARY: loops remote-relay on the macOS runner to prove the addWorker flake and its fix.
# Remove before merge.
name: tmp-flake-macos
on:
  pull_request:
    paths:
      - ".github/workflows/tmp-flake-macos.yml"
jobs:
  loop:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: cargo build --release --manifest-path apps/cli/Cargo.toml
      - run: pnpm build:web
      - run: pnpm --filter @band-app/server build
      - name: Loop remote-relay and addWorker users under CPU load
        working-directory: apps/hub
        run: |
          for i in 1 2 3 4; do (while :; do :; done) & done
          fail=0
          for i in $(seq 1 20); do
            NODE_OPTIONS='--no-warnings=ExperimentalWarning' npx vitest run tests/remote-relay.test.ts tests/remote-browser.test.ts tests/chat-ownership.test.ts || { fail=$((fail+1)); echo "run $i FAILED"; }
          done
          echo "failures: $fail of 20"
          [ "$fail" -eq 0 ]
