name: CI

on:
  push:
    branches: [main]
  # Use `pull_request` (NOT `pull_request_target`). The latter runs in the base
  # repo's context with secret access and shared-cache write privilege, while
  # checking out the fork's untrusted code — the exact "pwn request" + cache
  # poisoning chain described in the TanStack npm supply-chain compromise
  # postmortem (https://tanstack.com/blog/npm-supply-chain-compromise-postmortem).
  # `pull_request` runs fork PR code in an isolated context with no secrets and
  # PR-scoped cache writes, so a malicious PR cannot poison main's caches or
  # exfiltrate NPM_TOKEN / signing creds.
  pull_request:
    types: [opened, reopened, labeled, synchronize]
    branches: [main]
  # GitHub's merge queue runs the required checks on each queued PR merged
  # onto main (and onto the PRs queued ahead of it) before it lands.
  merge_group:
    types: [checks_requested]

# Checkout: every job uses actions/checkout's default ref. For a pull request
# that is refs/pull/N/merge, the PR merged onto main's current tip, so a PR is
# tested with main's latest commits instead of on its own. (The explicit
# `ref: head.sha` it replaced dates from when this workflow ran under
# `pull_request_target`, whose default checkout is the BASE branch. Under
# `pull_request` the merge ref is the fork's code in the same isolated,
# secret-less context, so fork safety is unchanged.) A merge group checks out
# the queue's temporary branch, a push checks out the pushed commit.
#
# One run per PR: a new push to the PR cancels the run for the old merge ref.
# Pushes to main and merge groups are keyed by commit, so each is tested.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    # Always run on push to main.
    # For same-repo PRs (collaborators): run automatically.
    # For fork PRs: only run when a maintainer adds the 'ci:approved' label.
    # The label gate is now a cost filter (don't burn CI minutes on every
    # drive-by fork PR), NOT a security barrier — the trigger above already
    # isolates fork PRs from secrets and shared cache writes.
    # Note: under `pull_request`, fork PRs run the fork's own ci.yml, so this
    # gate is also unreliable as a cost control — a malicious or zealous fork
    # can simply remove the `if:` and burn minutes. Stricter cost controls
    # (e.g. paused-by-default workflows, billing limits) belong at the
    # GitHub Actions account/org level, not in YAML the fork can edit.
    if: >
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'ci:approved')

    env:
      NODE_OPTIONS: "--max-old-space-size=6144"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Restore caches always (safe to read from untrusted runs). Saves are
      # split out below and gated on trusted events as defence-in-depth —
      # see "Save … cache" steps near the end of the job. IMPORTANT: keep
      # `path` and `key` in lock-step between Restore and Save halves; an
      # edit to one without the matching change to the other silently
      # creates dangling cache entries. (A previous attempt to hoist these
      # to job-level `env:` failed because `runner.os` isn't available in
      # `jobs.<id>.env` context — GitHub couldn't parse the workflow.)
      - name: Restore Cargo registry cache
        id: cache-cargo-registry
        uses: actions/cache/restore@v5
        with:
          # When editing path/key here, mirror in "Save Cargo registry cache".
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Restore CLI target cache
        id: cache-cargo-cli
        uses: actions/cache/restore@v5
        with:
          # When editing path/key here, mirror in "Save CLI target cache".
          path: apps/cli/target
          key: cargo-cli-${{ runner.os }}-${{ hashFiles('apps/cli/Cargo.lock') }}
          restore-keys: cargo-cli-${{ runner.os }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      # .nvmrc holds the Node major the desktop app ships (Electron's bundled
      # Node), so CI tests the runtime users actually run.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # Split restore/save like the cargo caches above, instead of
      # setup-node's `cache: 'pnpm'`, whose post-step save has no trust gate.
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        id: cache-pnpm-store
        uses: actions/cache/restore@v5
        with:
          # When editing path/key here, mirror in "Save pnpm store cache".
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Build CLI
        run: cargo build --release --manifest-path apps/cli/Cargo.toml

      # node-pty 1.1.0 ships no linux-x64 prebuild and falls back to
      # `node-gyp rebuild` during `pnpm install`. pnpm/action-setup@v6 no
      # longer surfaces pnpm's bundled node-gyp on PATH, so we install it
      # explicitly to keep the install step working on ubuntu-latest.
      - name: Install node-gyp
        run: npm install -g node-gyp

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Saved right after install, when the store is complete. Same trust
      # gate as the cargo saves below (see the comment block there).
      - name: Save pnpm store cache
        if: |
          steps.cache-pnpm-store.outputs.cache-hit != 'true' &&
          ((github.event_name != 'pull_request' &&
            github.event_name != 'pull_request_target') ||
           github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          # When editing path/key here, mirror in "Restore pnpm store cache".
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Lint (Biome)
        run: pnpm exec biome check .

      - name: Check unused exports & dependencies (knip)
        run: pnpm knip

      - name: Check code duplication (jscpd)
        run: pnpm jscpd

      - name: Lint (cargo fmt)
        run: cargo fmt --manifest-path apps/cli/Cargo.toml -- --check

      - name: Lint (cargo clippy — CLI)
        run: cargo clippy --manifest-path apps/cli/Cargo.toml -- -D warnings

      - name: Build web (needed by tests)
        run: pnpm build:web

      - name: Test (web)
        run: pnpm --filter @band-app/server test

      # Keyed on the Playwright version, with no restore-keys, so a bump
      # starts clean instead of carrying old browser builds forward.
      - name: Resolve Playwright version
        id: playwright
        working-directory: apps/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers cache
        id: cache-playwright
        uses: actions/cache/restore@v5
        with:
          # When editing path/key here, mirror in "Save Playwright browsers cache".
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # `--with-deps` still installs the apt packages on a cache hit; the hit
      # only skips the browser download.
      - name: Install Playwright Chromium
        run: pnpm --filter @band-app/server exec playwright install --with-deps chromium

      - name: Save Playwright browsers cache
        if: |
          steps.cache-playwright.outputs.cache-hit != 'true' &&
          ((github.event_name != 'pull_request' &&
            github.event_name != 'pull_request_target') ||
           github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          # When editing path/key here, mirror in "Restore Playwright browsers cache".
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Test e2e (web)
        run: pnpm --filter @band-app/server test:e2e

      # Playwright writes per-failure error-context.md snapshots (+ any traces)
      # into test-results/. Without this upload a CI-only e2e flake leaves
      # nothing to diagnose beyond the assertion message in the log.
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Test (CLI)
        run: cargo test --manifest-path apps/cli/Cargo.toml -- --test-threads=4

      # Cache writes (defence-in-depth). Even though our CI trigger is now
      # `pull_request` (PR-scoped cache writes can't poison main), gating the
      # save explicitly on a trusted event ensures a future workflow change
      # that re-introduces `pull_request_target` cannot pollute the shared
      # cargo caches that release.yml and nightly.yml also consume. Skipped
      # entirely on an exact restore-key hit so we don't re-write identical
      # state. See: TanStack npm supply-chain compromise postmortem.
      #
      # The two save steps differ in their failure semantics:
      #
      #   - Cargo registry cache: `always()` so we save even when later
      #     steps fail or the job is cancelled. The registry holds
      #     downloaded crate tarballs plus an index — a cancellation
      #     mid-download may leave incomplete files, but cargo
      #     re-validates against the index on the next run, so a re-save
      #     is safe.
      #
      #   - CLI target cache: defaults to `success()` (no `always()`). The
      #     target dir holds incremental compiler artifacts — saving them
      #     after a failed cargo build/test can produce a cache entry that
      #     poisons the next run with broken incremental state.
      #
      # The trust gate explicitly excludes BOTH `pull_request` and
      # `pull_request_target`; the latter would otherwise sneak past a
      # `!= 'pull_request'` short-circuit (`pull_request_target` is a
      # distinct event name) and re-introduce the exact poisoning vector
      # this PR is meant to block as defence-in-depth. Non-PR triggers
      # (push, workflow_dispatch, schedule, repository_dispatch,
      # workflow_call, …) remain allowed without an explicit allowlist
      # entry. NOTE for workflow_call: if ci.yml is ever exposed as a
      # reusable workflow, `github.event_name` reflects the CALLER's
      # event, so a caller running under `pull_request_target` would
      # propagate that here and (correctly) be blocked.
      - name: Save Cargo registry cache
        if: |
          always() &&
          steps.cache-cargo-registry.outputs.cache-hit != 'true' &&
          ((github.event_name != 'pull_request' &&
            github.event_name != 'pull_request_target') ||
           github.event.pull_request.head.repo.full_name == github.repository)
        # Best-effort: if the registry save fails (cache size limits,
        # transient service error), don't poison the job — the CLI-target
        # save's `success()` gate would otherwise skip silently.
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          # When editing path/key here, mirror in "Restore Cargo registry cache".
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # NOTE on placement: save steps land here, after `Test (CLI)` and
      # before `Build desktop`. That's fine today because no Cargo step
      # runs after this point — TypeScript/Node desktop build doesn't
      # touch apps/cli/target. If a future Rust step is added later in
      # the job, move both save steps to the very end so its output
      # gets cached.
      - name: Save CLI target cache
        # No `success()` — GitHub Actions applies it implicitly when no
        # status function is present in the expression. Mirroring that
        # default keeps the contrast with the registry-save `always()`
        # explicit: registry saves even on failure/cancel, CLI target
        # only on a clean run (so we don't cache broken incremental state).
        if: |
          steps.cache-cargo-cli.outputs.cache-hit != 'true' &&
          ((github.event_name != 'pull_request' &&
            github.event_name != 'pull_request_target') ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@v5
        with:
          # When editing path/key here, mirror in "Restore CLI target cache".
          path: apps/cli/target
          key: cargo-cli-${{ runner.os }}-${{ hashFiles('apps/cli/Cargo.lock') }}

      - name: Build desktop (TypeScript main + preload)
        run: pnpm --filter @band-app/desktop build

      - name: Test (desktop)
        run: pnpm --filter @band-app/desktop test

  # ---------------------------------------------------------------------------
  # macOS jobs.
  #
  # The `check` job runs everything on ubuntu-latest, but several Band paths
  # behave differently on macOS, and release.yml and nightly.yml run the tests
  # on macos-latest. Two macOS jobs close that gap before merge:
  #
  #   - `cli-macos` runs the CLI integration tests. The `/var/folders` →
  #     `/private/var/folders` symlink that canonicalize() and git resolve but
  #     a raw temp path does not silently dropped seeded worktrees during
  #     path-string reconciliation (the server reconciles worktrees by path
  #     equality since #606) and broke four CLI integration tests. That passed
  #     on every Linux PR and only surfaced on the macos-latest release runner
  #     for v0.24.0 (harness fix: #608).
  #   - `web-macos` runs the web server's vitest suite, the same step as
  #     release.yml and nightly.yml. Before it existed, macOS-only failures in
  #     those tests first showed up in a release or a nightly run.
  #
  # They are not macOS clones of `check`: macOS runners are slower and
  # costlier, so each runs only the suite with a macOS-specific failure mode
  # (no lint, no e2e), and `macos-changes` below skips each one on PRs that
  # don't touch its code. A skipped job counts as passed for a required check,
  # so both job names can be required. Pushes to main always run both.
  # ---------------------------------------------------------------------------
  macos-changes:
    name: Detect macOS-relevant changes
    runs-on: ubuntu-latest
    # Mirror the `check` job's cost gate: run on push to main, in the merge
    # queue, on same-repo PRs (collaborators), and on fork PRs a maintainer
    # labelled `ci:approved`.
    if: >
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'ci:approved')
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so the base commit is reachable for the diff below.
          fetch-depth: 0

      # Native git-diff path gate — same idiom as the "Check for docs changes"
      # step in deploy-docs, so we don't add a third-party action to a workflow
      # this security-conscious repo deliberately runs under `pull_request`
      # (no secrets, PR-scoped cache). Fails OPEN: any ambiguity about the base
      # runs the macOS jobs rather than risk skipping a real regression.
      - name: Detect macOS-relevant changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) BASE="$PR_BASE"; HEAD="$PR_HEAD" ;;
            merge_group) BASE="$QUEUE_BASE"; HEAD="$QUEUE_HEAD" ;;
            *) BASE="$PUSH_BASE"; HEAD="$PUSH_HEAD" ;;
          esac

          run_all() {
            echo "cli=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # No usable base (first push, force-push, all-zero SHA): fail open.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            run_all
          fi
          # `fetch-depth: 0` above already pulls full history, so $BASE is
          # normally present. This shallow fetch is a belt-and-suspenders net
          # for the edge case where the base branch was force-pushed and $BASE
          # (recorded at PR-creation time) is orphaned from the fetched refs —
          # GitHub still serves the loose commit. Then diff against the merge
          # base (three-dot) so we only see what THIS branch changed, not
          # unrelated commits that landed on main. Any git error → fail open.
          git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null || true
          if ! CHANGED=$(git diff --name-only "$BASE...$HEAD" 2>/dev/null); then
            run_all
          fi

          # CLI: the surface that can trigger the macOS-only worktree
          # path-reconciliation bug: the CLI + its test harness, the server
          # sync/workspace services, the workspaces query layer, and this
          # workflow file itself.
          if grep -qE '^(apps/cli/|apps/web/src/server/services/(sync-service|workspace-service)\.ts$|apps/web/src/server/infra/db/queries/workspaces\.ts$|\.github/workflows/ci\.yml$)' <<< "$CHANGED"; then
            echo "cli=true" >> "$GITHUB_OUTPUT"
          else
            echo "cli=false" >> "$GITHUB_OUTPUT"
          fi

          # Web: what the vitest suite exercises beyond the React UI: the
          # server (terminals, the terminal daemon, workspaces and git live
          # under src/server/), the code it shares with the client, the tests
          # and their build, the workspace packages and plugins the server
          # loads, the CLI the tests shell out to, the lockfile and Node
          # version, and this workflow file. A change only to the React UI
          # (components, dashboard, routes) or to e2e specs stays Linux-only.
          # Pushes to main always run it. (A here-string, not a pipe: under
          # pipefail, `grep -q` exiting early would fail the pipe on a big diff.)
          if [ "$EVENT_NAME" = "push" ] || grep -qE '^(apps/web/(src/(server|shared|lib)/|tests/|scripts/|start-server\.ts$|terminal-daemon\.ts$|package\.json$|vitest\.config\.ts$)|packages/|plugins/|apps/cli/|pnpm-lock\.yaml$|\.nvmrc$|\.github/workflows/ci\.yml$)' <<< "$CHANGED"; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  cli-macos:
    name: CLI Integration Tests (macOS)
    runs-on: macos-latest
    needs: macos-changes
    if: needs.macos-changes.outputs.cli == 'true'
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `runner.os` is "macOS" here, so these keys are naturally distinct from
      # the ubuntu `check` job's `Linux` cache entries — no cross-OS collision.
      # See the `check` job for the full restore/save rationale; keep each
      # Restore/Save pair's path & key in lock-step.
      - name: Restore Cargo registry cache
        id: cache-cargo-registry
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Restore CLI target cache
        id: cache-cargo-cli
        uses: actions/cache/restore@v5
        with:
          path: apps/cli/target
          key: cargo-cli-${{ runner.os }}-${{ hashFiles('apps/cli/Cargo.lock') }}
          restore-keys: cargo-cli-${{ runner.os }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # macos-latest ships node-pty's darwin prebuild, so (unlike the ubuntu
      # job) no explicit `node-gyp` install is needed — matches release.yml.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the web server bundle the integration tests drive: each test
      # boots `apps/web/dist/start-server.mjs` (a real node Band server) and
      # runs CLI commands against it. The CLI binary itself is compiled by the
      # `cargo test` step below via `env!("CARGO_BIN_EXE_band")` (test profile),
      # so — unlike the `check`/`release` jobs — there is deliberately NO
      # separate `cargo build --release` step here: those jobs release-build the
      # CLI only so their *web* tests can shell out to a real `band` on PATH,
      # and this CLI-only job runs no web tests. Dropping the release build
      # avoids compiling the crate twice on the slower/costlier macOS runner
      # (the exact cost #609 asks us to economise on).
      - name: Build web (needed by tests)
        run: pnpm build:web

      # Keep --test-threads=4 (matching ci.yml `check` and release.yml): each
      # test boots its own real Band server on a random port, and unbounded
      # parallelism floods the slower macOS runner so servers aren't ready when
      # `workspaces create` dispatches, flaking the worktree-dependent tests.
      - name: Test (CLI)
        run: cargo test --manifest-path apps/cli/Cargo.toml -- --test-threads=4

      # Cache writes, gated on trusted events as defence-in-depth — same policy
      # and failure semantics as the `check` job (registry saves `always()`,
      # CLI target only on `success()` so broken incremental state isn't cached).
      - name: Save Cargo registry cache
        if: |
          always() &&
          steps.cache-cargo-registry.outputs.cache-hit != 'true' &&
          ((github.event_name != 'pull_request' &&
            github.event_name != 'pull_request_target') ||
           github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Save CLI target cache
        if: |
          steps.cache-cargo-cli.outputs.cache-hit != 'true' &&
          ((github.event_name != 'pull_request' &&
            github.event_name != 'pull_request_target') ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@v5
        with:
          path: apps/cli/target
          key: cargo-cli-${{ runner.os }}-${{ hashFiles('apps/cli/Cargo.lock') }}

  web-macos:
    name: Web Tests (macOS)
    runs-on: macos-latest
    needs: macos-changes
    if: needs.macos-changes.outputs.web == 'true'
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Same restore/save split and trust gate as the `check` job; keep each
      # Restore/Save pair's path & key in lock-step. The CLI target cache has
      # its own key: this job release-builds the CLI while `cli-macos` fills
      # `cargo-cli-macOS-*` with a test-profile build, and whichever saved
      # first would leave the other compiling from scratch every run. The
      # fallback restore-key still reuses that cache's dependencies.
      - name: Restore Cargo registry cache
        id: cache-cargo-registry
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Restore CLI release target cache
        id: cache-cargo-cli
        uses: actions/cache/restore@v5
        with:
          path: apps/cli/target
          key: cargo-cli-release-${{ runner.os }}-${{ hashFiles('apps/cli/Cargo.lock') }}
          restore-keys: |
            cargo-cli-release-${{ runner.os }}-
            cargo-cli-${{ runner.os }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        id: cache-pnpm-store
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # macos-latest ships node-pty's darwin prebuild, so (unlike the ubuntu
      # job) no explicit `node-gyp` install is needed — matches release.yml.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Save pnpm store cache
        if: |
          steps.cache-pnpm-store.outputs.cache-hit != 'true' &&
          ((github.event_name != 'pull_request' &&
            github.event_name != 'pull_request_target') ||
           github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Some web tests (e.g. `cli-skills.test.ts`) shell out to a real `band`
      # binary, so build it first, as `check`, release.yml and nightly.yml do.
      - name: Build CLI
        run: cargo build --release --manifest-path apps/cli/Cargo.toml

      - name: Build web (needed by tests)
        run: pnpm build:web

      - name: DIAG echo latency (isolated)
        continue-on-error: true
        working-directory: apps/web
        env:
          BAND_ECHO_DIAG: "1"
          BAND_ECHO_DIAG_ROUNDS: "5"
        run: |
          sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string || true
          NODE_OPTIONS='--no-warnings=ExperimentalWarning' npx vitest run tests/echo-latency-diag.test.ts
          for i in 1 2 3 4 5; do NODE_OPTIONS='--no-warnings=ExperimentalWarning' npx vitest run tests/terminal-echo-during-branch-poll.test.ts 2>&1 | grep -E "echoes|✓|×|Tests" || true; done

      - name: DIAG echo latency (inside the full suite)
        continue-on-error: true
        env:
          BAND_ECHO_DIAG: "1"
          BAND_ECHO_DIAG_ROUNDS: "3"
        run: pnpm --filter @band-app/server test

      - name: Save Cargo registry cache
        if: |
          always() &&
          steps.cache-cargo-registry.outputs.cache-hit != 'true' &&
          ((github.event_name != 'pull_request' &&
            github.event_name != 'pull_request_target') ||
           github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Save CLI release target cache
        if: |
          steps.cache-cargo-cli.outputs.cache-hit != 'true' &&
          ((github.event_name != 'pull_request' &&
            github.event_name != 'pull_request_target') ||
           github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: apps/cli/target
          key: cargo-cli-release-${{ runner.os }}-${{ hashFiles('apps/cli/Cargo.lock') }}

  deploy-docs:
    name: Deploy Docs
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check for docs changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- apps/website/ || true)
          if [ -z "$CHANGED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.changes.outputs.changed == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          # deploy-docs only runs on push to main, so this ungated save
          # never runs for untrusted code.
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build docs
        if: steps.changes.outputs.changed == 'true'
        run: pnpm --filter @band-app/docs build
        env:
          # PostHog analytics — public-by-design project key, safe to expose in
          # the built bundle but kept in secrets for parity with other config.
          # Astro inlines PUBLIC_* env vars at build time, so they must be set
          # here (Cloudflare Pages dashboard vars do NOT apply — we only upload
          # the prebuilt dist/ to Pages, we don't build on Pages).
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}

      - name: Deploy to Cloudflare Pages
        if: steps.changes.outputs.changed == 'true'
        run: npx wrangler pages deploy apps/website/dist --project-name=band-docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
