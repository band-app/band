name: CI

on:
  push:
    branches: [main]
  # Use `pull_request` (NOT `pull_request_target`). The latter runs in the base
  # repo's context with secret access and shared-cache write privilege, while
  # checking out the fork's untrusted code — the exact "pwn request" + cache
  # poisoning chain described in the TanStack npm supply-chain compromise
  # postmortem (https://tanstack.com/blog/npm-supply-chain-compromise-postmortem).
  # `pull_request` runs fork PR code in an isolated context with no secrets and
  # PR-scoped cache writes, so a malicious PR cannot poison main's caches or
  # exfiltrate NPM_TOKEN / signing creds.
  pull_request:
    types: [opened, reopened, labeled, synchronize]
    branches: [main]
  # GitHub's merge queue runs the required checks on each queued PR merged
  # onto main (and onto the PRs queued ahead of it) before it lands.
  merge_group:
    types: [checks_requested]
  # Every macOS job in full, on main. A pull request or merge-queue run starts
  # only the macOS jobs whose paths changed (scripts/ci/macos-changes.sh), so
  # the nightly run is what catches a macOS-only break outside those paths.
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

# Checkout: every job uses actions/checkout's default ref. For a pull request
# that is refs/pull/N/merge, the PR merged onto main's current tip, so a PR is
# tested with main's latest commits instead of on its own. (The explicit
# `ref: head.sha` it replaced dates from when this workflow ran under
# `pull_request_target`, whose default checkout is the BASE branch. Under
# `pull_request` the merge ref is the fork's code in the same isolated,
# secret-less context, so fork safety is unchanged.) A merge group checks out
# the queue's temporary branch, a push checks out the pushed commit.
#
# One run per PR: a new push to the PR cancels the run for the old merge ref.
# A new push to main cancels the previous in-progress main run. Merge groups
# are keyed by commit, so each queued entry is tested.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # A re-based merge-queue entry gets a new sha, so the concurrency group above
  # does not cancel the run of the entry it replaced, and that run keeps its
  # macOS runners. Expressions cannot parse the PR number out of
  # `gh-readonly-queue/main/pr-<n>-<sha>`, so this job does: it cancels every
  # older merge_group run of the same PR (a lower run id, so a late-starting old
  # run can never cancel its replacement) and leaves other PRs alone.
  cancel-superseded:
    name: Cancel superseded queue runs
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel older runs of this PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          PR=$(printf '%s' "$HEAD_REF" | sed -n 's|^refs/heads/gh-readonly-queue/[^/]*/pr-\([0-9][0-9]*\)-.*|\1|p')
          if [ -z "$PR" ]; then
            echo "No PR number in $HEAD_REF; nothing to cancel."
            exit 0
          fi
          for status in queued in_progress; do
            gh api --paginate "repos/$REPO/actions/workflows/ci.yml/runs?event=merge_group&status=$status&per_page=100" \
              --jq ".workflow_runs[] | select(.head_branch | test(\"^gh-readonly-queue/[^/]+/pr-$PR-\")) | select(.id < $RUN_ID) | .id" |
              while read -r id; do
                echo "Cancelling run $id (older entry of PR #$PR)"
                gh api -X POST "repos/$REPO/actions/runs/$id/cancel" || true
              done
          done

  # Decides whether a pull request changed anything the test jobs cover. A
  # change only to docs, the website or root Markdown skips them; the two
  # required checks still report (see `lint-test-build`). Pushes and the merge
  # queue always run everything, and any git error fails open.
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'ci:approved')
    outputs:
      code: ${{ steps.filter.outputs.code }}
      e2e_mode: ${{ steps.e2e.outputs.mode }}
      e2e_specs: ${{ steps.e2e.outputs.specs }}
      e2e_matrix: ${{ steps.e2e.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A push to main lands a commit the merge queue already tested, so
          # the test jobs do not run again. The release gate accepts the
          # merge_group run of the same commit (scripts/check-ci-green.sh).
          if [ "$EVENT_NAME" = "push" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Push to main: the merge queue tested this commit, so the test jobs are skipped."
            exit 0
          fi
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$PR_BASE" 2>/dev/null || true
          if ! CHANGED=$(git diff --name-only "$PR_BASE...$PR_HEAD" 2>/dev/null) || [ -z "$CHANGED" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Anything outside these paths is code. No test reads them, and the
          # workflow files are not listed, so editing CI always runs it.
          CODE=$(grep -vE '^(docs/|apps/website/|\.am/|[^/]+\.md$|LICENSE$)' <<< "$CHANGED" || true)
          if [ -n "$CODE" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only docs changed, so the test jobs are skipped:"
            echo "$CHANGED"
          fi

      - name: Test the e2e selection script
        run: node --test scripts/ci/affected-e2e.test.mjs

      # Which web e2e specs run. A pull request runs the specs its change affects plus a
      # smoke set; a push and the merge queue run every spec. Any failure of the selection
      # (script error, shallow history, missing output) runs every spec.
      - name: Select e2e specs
        id: e2e
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$PR_BASE" 2>/dev/null || true
          fi
          if ! node scripts/ci/affected-e2e.mjs --event "$EVENT_NAME" --base "$PR_BASE" --head "$PR_HEAD" --github-output; then
            echo "The selection failed, so every spec runs."
            {
              echo "mode=all"
              echo "specs="
              echo 'matrix={"shard":[1,2,3],"total":[3]}'
            } >> "$GITHUB_OUTPUT"
          fi

  # Builds the web client, the hub bundle, the worker bundle and the release
  # CLI once. The hub, remote-loopback, e2e and package shards unpack this
  # instead of each building it again (tar keeps file modes, which
  # upload-artifact drops). `check` keeps its own build and owns the cache
  # saves.
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: changes
    if: >
      needs.changes.outputs.code == 'true' && (
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'ci:approved'))
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-rust

      - name: Build web and hub
        run: pnpm build:web

      - name: Build worker
        run: pnpm --filter @band-app/worker build

      - name: Pack the build
        run: |
          tar -czf "$RUNNER_TEMP/build.tar.gz" \
            apps/web/dist apps/hub/dist apps/worker/dist apps/cli/target/release/band
          ls -lh "$RUNNER_TEMP/build.tar.gz"

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: ${{ runner.temp }}/build.tar.gz
          compression-level: 0
          retention-days: 1

  check:
    name: Lint & Build
    runs-on: ubuntu-24.04
    # A hung test must not hold the job for the 6 hour default.
    timeout-minutes: 45

    # Always run on push to main.
    # For same-repo PRs (collaborators): run automatically.
    # For fork PRs: only run when a maintainer adds the 'ci:approved' label.
    # The label gate is now a cost filter (don't burn CI minutes on every
    # drive-by fork PR), NOT a security barrier — the trigger above already
    # isolates fork PRs from secrets and shared cache writes.
    # Note: under `pull_request`, fork PRs run the fork's own ci.yml, so this
    # gate is also unreliable as a cost control — a malicious or zealous fork
    # can simply remove the `if:` and burn minutes. Stricter cost controls
    # (e.g. paused-by-default workflows, billing limits) belong at the
    # GitHub Actions account/org level, not in YAML the fork can edit.
    needs: changes
    if: >
      needs.changes.outputs.code == 'true' && (
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'ci:approved'))

    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
      # runner-docker.test.ts needs the worker image, which only the `docker` job builds.
      BAND_DOCKER_TEST_RUNS_IN_DOCKER_JOB: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Restore caches always (safe to read from untrusted runs). Saves are
      # split out below and gated on trusted events as defence-in-depth —
      # see "Save … cache" steps near the end of the job. IMPORTANT: keep
      # `path` and `key` in lock-step between Restore and Save halves; an
      # edit to one without the matching change to the other silently
      # creates dangling cache entries. (A previous attempt to hoist these
      # to job-level `env:` failed because `runner.os` isn't available in
      # `jobs.<id>.env` context — GitHub couldn't parse the workflow.)
      - name: Restore Cargo registry cache
        id: cache-cargo-registry
        uses: actions/cache/restore@v5
        with:
          # When editing path/key here, mirror in "Save Cargo registry cache".
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Restore CLI target cache
        id: cache-cargo-cli
        uses: actions/cache/restore@v5
        with:
          # When editing path/key here, mirror in "Save CLI target cache".
          path: apps/cli/target
          key: cargo-cli-${{ runner.os }}-${{ hashFiles('apps/cli/Cargo.lock') }}
          restore-keys: cargo-cli-${{ runner.os }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      # .nvmrc holds the Node major the desktop app ships (Electron's bundled
      # Node), so CI tests the runtime users actually run.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # Split restore/save like the cargo caches above, instead of
      # setup-node's `cache: 'pnpm'`, whose post-step save has no trust gate.
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        id: cache-pnpm-store
        uses: actions/cache/restore@v5
        with:
          # When editing path/key here, mirror in "Save pnpm store cache".
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Build CLI
        run: cargo build --release --manifest-path apps/cli/Cargo.toml

      # node-pty 1.1.0 ships no linux-x64 prebuild and falls back to
      # `node-gyp rebuild` during `pnpm install`. pnpm/action-setup@v6 no
      # longer surfaces pnpm's bundled node-gyp on PATH, so we install it
      # explicitly to keep the install step working on ubuntu-24.04.
      - name: Install node-gyp
        run: npm install -g node-gyp

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Saved right after install, when the store is complete. Same trust
      # gate as the cargo saves below (see the comment block there).
      - name: Save pnpm store cache
        if: |
          steps.cache-pnpm-store.outputs.cache-hit != 'true' &&
          ((github.event_name != 'pull_request' &&
            github.event_name != 'pull_request_target') ||
           github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          # When editing path/key here, mirror in "Restore pnpm store cache".
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Test (CI report scripts)
        run: node --test scripts/ci/tests/*.test.mjs

      - name: Lint (Biome)
        run: pnpm exec biome check .

      - name: Check worktree ids are built by toWorktreeId
        run: ./scripts/check-worktree-ids.sh

      - name: Check UI code uses theme tokens, not hardcoded colors
        run: node scripts/check-theme-tokens.mjs

      - name: Check unused exports & dependencies (knip)
        run: pnpm knip

      - name: Check code duplication (jscpd)
        run: pnpm jscpd

      - name: Lint (cargo fmt)
        run: cargo fmt --manifest-path apps/cli/Cargo.toml -- --check

      - name: Lint (cargo clippy — CLI)
        run: cargo clippy --manifest-path apps/cli/Cargo.toml -- -D warnings

      - name: Build web (needed by tests)
        run: pnpm build:web

      - name: Test (CLI)
        run: cargo test --manifest-path apps/cli/Cargo.toml -- --test-threads=4

      - name: Build docs site (link and phrase checks)
        run: pnpm --filter @band-app/docs build

      # Cache writes (defence-in-depth). Even though our CI trigger is now
      # `pull_request` (PR-scoped cache writes can't poison main), gating the
      # save explicitly on a trusted event ensures a future workflow change
      # that re-introduces `pull_request_target` cannot pollute the shared
      # cargo caches that release.yml and nightly.yml also consume. Skipped
      # entirely on an exact restore-key hit so we don't re-write identical
      # state. See: TanStack npm supply-chain compromise postmortem.
      #
      # The two save steps differ in their failure semantics:
      #
      #   - Cargo registry cache: `always()` so we save even when later
      #     steps fail or the job is cancelled. The registry holds
      #     downloaded crate tarballs plus an index — a cancellation
      #     mid-download may leave incomplete files, but cargo
      #     re-validates against the index on the next run, so a re-save
      #     is safe.
      #
      #   - CLI target cache: defaults to `success()` (no `always()`). The
      #     target dir holds incremental compiler artifacts — saving them
      #     after a failed cargo build/test can produce a cache entry that
      #     poisons the next run with broken incremental state.
      #
      # The trust gate explicitly excludes BOTH `pull_request` and
      # `pull_request_target`; the latter would otherwise sneak past a
      # `!= 'pull_request'` short-circuit (`pull_request_target` is a
      # distinct event name) and re-introduce the exact poisoning vector
      # this PR is meant to block as defence-in-depth. Non-PR triggers
      # (push, workflow_dispatch, schedule, repository_dispatch,
      # workflow_call, …) remain allowed without an explicit allowlist
      # entry. NOTE for workflow_call: if ci.yml is ever exposed as a
      # reusable workflow, `github.event_name` reflects the CALLER's
      # event, so a caller running under `pull_request_target` would
      # propagate that here and (correctly) be blocked.
      - name: Save Cargo registry cache
        if: |
          always() &&
          steps.cache-cargo-registry.outputs.cache-hit != 'true' &&
          ((github.event_name != 'pull_request' &&
            github.event_name != 'pull_request_target') ||
           github.event.pull_request.head.repo.full_name == github.repository)
        # Best-effort: if the registry save fails (cache size limits,
        # transient service error), don't poison the job — the CLI-target
        # save's `success()` gate would otherwise skip silently.
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          # When editing path/key here, mirror in "Restore Cargo registry cache".
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # NOTE on placement: save steps land here, after `Test (CLI)` and
      # before `Build desktop`. That's fine today because no Cargo step
      # runs after this point — TypeScript/Node desktop build doesn't
      # touch apps/cli/target. If a future Rust step is added later in
      # the job, move both save steps to the very end so its output
      # gets cached.
      - name: Save CLI target cache
        # No `success()` — GitHub Actions applies it implicitly when no
        # status function is present in the expression. Mirroring that
        # default keeps the contrast with the registry-save `always()`
        # explicit: registry saves even on failure/cancel, CLI target
        # only on a clean run (so we don't cache broken incremental state).
        if: |
          steps.cache-cargo-cli.outputs.cache-hit != 'true' &&
          ((github.event_name != 'pull_request' &&
            github.event_name != 'pull_request_target') ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@v5
        with:
          # When editing path/key here, mirror in "Restore CLI target cache".
          path: apps/cli/target
          key: cargo-cli-${{ runner.os }}-${{ hashFiles('apps/cli/Cargo.lock') }}

      - name: Build desktop (TypeScript main + preload)
        run: pnpm --filter @band-app/desktop build

      - name: Test (desktop)
        run: pnpm --filter @band-app/desktop test

      # Biome above already lints apps/mobile; the iOS build is the `mobile-ios` job.
      - name: Typecheck (mobile)
        run: pnpm --filter @band-app/mobile typecheck

      - name: Test (mobile)
        run: pnpm --filter @band-app/mobile test
  # The test jobs unpack the `build` job's artifact (web client, hub and worker
  # bundles, release CLI) instead of building it again, so they install
  # dependencies but skip Rust. `check` owns the cache saves.
  test-hub:
    name: Test (hub) ${{ matrix.shard }}/${{ matrix.total }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [changes, build]
    if: >
      needs.changes.outputs.code == 'true' && (
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'ci:approved'))
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        total: [2]
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
      # runner-docker.test.ts needs the worker image, which only the `docker` job builds.
      BAND_DOCKER_TEST_RUNS_IN_DOCKER_JOB: "1"
      BAND_FLAKY_DIR: ${{ github.workspace }}/flaky-results
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-rust
        with:
          rust: "false"

      - uses: ./.github/actions/use-build

      # The remote browser suites skip when no Chromium is found.
      - uses: ./.github/actions/setup-playwright
        timeout-minutes: 20
        with:
          browsers: chromium

      - name: Test (hub)
        env:
          # The runner's user namespace policy can stop Chromium's sandbox from starting.
          BAND_CHROMIUM_NO_SANDBOX: "1"
          BAND_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/band-test-artifacts
        run: pnpm --filter @band-app/server test --shard=${{ matrix.shard }}/${{ matrix.total }}

      # Tests that failed and then passed on the CI retry (scripts/ci/report-flaky.mjs reads these).
      - name: Upload flaky results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-hub-${{ matrix.shard }}
          path: ${{ github.workspace }}/flaky-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload hub failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hub-failure-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/band-test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  test-packages:
    name: Test (web unit & packages)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [changes, build]
    if: >
      needs.changes.outputs.code == 'true' && (
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'ci:approved'))
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
      BAND_FLAKY_DIR: ${{ github.workspace }}/flaky-results
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-rust
        with:
          rust: "false"

      # The hub build the worker and host-local suites read from dist.
      - uses: ./.github/actions/use-build

      - uses: ./.github/actions/setup-playwright
        timeout-minutes: 20
        with:
          browsers: chromium

      - name: Test (web unit & packages)
        env:
          BAND_CHROMIUM_NO_SANDBOX: "1"
        run: |
          pnpm --filter @band-app/web test
          pnpm --filter @band-app/link test
          pnpm --filter @band-app/environment test
          pnpm --filter @band-app/client test
          pnpm --filter @band-app/shared test
          pnpm --filter @band-app/host-local test
          pnpm --filter @band-app/worker test

      # Tests that failed and then passed on the CI retry (scripts/ci/report-flaky.mjs reads these).
      - name: Upload flaky results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-packages
          path: ${{ github.workspace }}/flaky-results/
          if-no-files-found: ignore
          retention-days: 7

  test-e2e:
    name: Test e2e (web) ${{ matrix.shard }}/${{ matrix.total }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [changes, build]
    if: >
      needs.changes.outputs.code == 'true' && (
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'ci:approved'))
    strategy:
      fail-fast: false
      # One shard for a small pull-request selection, three for the full suite.
      matrix: ${{ fromJSON(needs.changes.outputs.e2e_matrix || '{"shard":[1,2,3],"total":[3]}') }}
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
      # Playwright's JSON reporter (apps/web/playwright.config.ts) writes here.
      PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/flaky-results/playwright-${{ matrix.shard }}.json
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-rust
        with:
          rust: "false"

      - uses: ./.github/actions/use-build

      - uses: ./.github/actions/setup-playwright
        timeout-minutes: 20

      # A real Xvfb and x11vnc for `e2e/desktop-viewer-x11vnc.spec.ts`, which fails on Linux CI without them.
      - name: Install Xvfb and x11vnc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb x11vnc x11-utils

      - name: Test e2e (web)
        env:
          E2E_MODE: ${{ needs.changes.outputs.e2e_mode }}
          E2E_SPECS: ${{ needs.changes.outputs.e2e_specs }}
        run: |
          if [ "$E2E_MODE" = "subset" ] && [ -n "$E2E_SPECS" ]; then
            echo "Pull request selection: $E2E_SPECS"
            # shellcheck disable=SC2086
            pnpm --filter @band-app/web test:e2e --shard=${{ matrix.shard }}/${{ matrix.total }} $E2E_SPECS
          else
            pnpm --filter @band-app/web test:e2e --shard=${{ matrix.shard }}/${{ matrix.total }}
          fi

      # Tests that failed and then passed on the CI retry (scripts/ci/report-flaky.mjs reads these).
      - name: Upload flaky results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-e2e-${{ matrix.shard }}
          path: ${{ github.workspace }}/flaky-results/
          if-no-files-found: ignore
          retention-days: 7

      # Playwright writes per-failure error-context.md snapshots (+ any traces)
      # into test-results/. Without this upload a CI-only e2e flake leaves
      # nothing to diagnose beyond the assertion message in the log.
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The hub suite again, with every worktree on a real band-worker over
  # loopback (plan step 2.6; docs/integration-testing.md, "Host modes"). It runs
  # beside `check` so the existing jobs don't get longer. The worker runs from
  # its bundle, so the packed package is what the hub talks to.
  test-remote-loopback:
    name: Test (remote-loopback) ${{ matrix.shard }}/${{ matrix.total }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
        total: [1]
    needs: [changes, build]
    if: >
      needs.changes.outputs.code == 'true' && (
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'ci:approved'))
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
      BAND_TEST_HOST: remote-loopback
      BAND_DOCKER_TEST_RUNS_IN_DOCKER_JOB: "1"
      BAND_WORKER_USE_DIST: "1"
      BAND_FLAKY_DIR: ${{ github.workspace }}/flaky-results
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-rust
        with:
          rust: "false"

      # Includes the CLI some hub tests shell out to, and the worker bundle.
      - uses: ./.github/actions/use-build

      # Installs the packed tarball into an empty directory, runs
      # `band-worker --help` and starts a PTY from that install.
      - name: Worker package smoke
        run: pnpm --filter @band-app/worker pack:smoke

      # The remote browser suite skips when no Chromium is found.
      - uses: ./.github/actions/setup-playwright
        timeout-minutes: 20
        with:
          browsers: chromium

      - name: Test hub (remote-loopback)
        run: pnpm --filter @band-app/server exec vitest run --shard=${{ matrix.shard }}/${{ matrix.total }}
        env:
          BAND_CHROMIUM_NO_SANDBOX: "1"
          BAND_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/band-test-artifacts
          NODE_OPTIONS: "--max-old-space-size=6144 --no-warnings=ExperimentalWarning"

      # Tests that failed and then passed on the CI retry (scripts/ci/report-flaky.mjs reads these).
      - name: Upload flaky results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-loopback-${{ matrix.shard }}
          path: ${{ github.workspace }}/flaky-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload hub failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: remote-loopback-failure-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/band-test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  # A test that failed and then passed on the CI retry does not fail its job. This job
  # collects what the test jobs recorded, prints it in the run summary and, for the merge
  # queue and main, files or updates one `flaky` issue per test. It is not part of
  # `lint-test-build`, so it never blocks a merge. `issues: write` is on this job only, and
  # a pull request run (a fork's too) only prints the summary.
  flaky-report:
    name: Flaky report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [test-hub, test-packages, test-e2e, test-remote-loopback]
    if: always() && !cancelled()
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Download flaky results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: flaky-*
          path: flaky-results

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          apply=""
          if [ "$EVENT_NAME" = "merge_group" ] || [ "$EVENT_NAME" = "push" ]; then apply="--apply"; fi
          node scripts/ci/report-flaky.mjs --results flaky-results $apply

  # Tests on .github/flaky-quarantine.txt are skipped in the blocking jobs above and run here.
  # The job never fails the workflow, and nothing waits for it, so a quarantined test keeps
  # producing results without dropping a PR.
  test-quarantine:
    name: Test (quarantine)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    needs: [changes, build]
    if: >
      needs.changes.outputs.code == 'true' && (
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'ci:approved'))
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
      BAND_DOCKER_TEST_RUNS_IN_DOCKER_JOB: "1"
      BAND_FLAKY_QUARANTINE: only
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Look for quarantined tests
        id: list
        run: |
          if grep -qE '^[^#[:space:]]' .github/flaky-quarantine.txt; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "The quarantine list is empty." >> "$GITHUB_STEP_SUMMARY"
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-node-rust
        if: steps.list.outputs.has == 'true'
        with:
          rust: "false"

      - uses: ./.github/actions/use-build
        if: steps.list.outputs.has == 'true'

      - uses: ./.github/actions/setup-playwright
        timeout-minutes: 20
        if: steps.list.outputs.has == 'true'

      - name: Test quarantined (hub)
        if: ${{ !cancelled() && steps.list.outputs.has == 'true' }}
        env:
          BAND_CHROMIUM_NO_SANDBOX: "1"
        run: pnpm --filter @band-app/server test

      - name: Test quarantined (web unit)
        if: ${{ !cancelled() && steps.list.outputs.has == 'true' }}
        run: pnpm --filter @band-app/web test

      - name: Test quarantined (web e2e)
        if: ${{ !cancelled() && steps.list.outputs.has == 'true' }}
        run: pnpm --filter @band-app/web test:e2e --pass-with-no-tests

  # The repo ruleset "Require CI active" requires a status check named exactly
  # "Lint, Test & Build", the name of the job this split replaced. This job
  # keeps that name and passes only when every split job succeeded. It carries
  # the same fork gate as they do, so it is skipped when they are. A skipped
  # needed job counts as a failure, except when `changes` found only docs: the
  # split jobs are skipped then and `changes` itself must have succeeded.
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-24.04
    needs: [changes, build, check, test-hub, test-packages, test-e2e, test-remote-loopback]
    if: >
      always() && (
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'ci:approved'))
    steps:
      - name: Require every split job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [ "$CODE_CHANGED" = "false" ]; then
            echo "Only docs changed: the test jobs are skipped."
            echo "$RESULTS" | jq -e '.changes.result == "success" and ([to_entries[] | select(.key != "changes") | .value.result] | all(. == "skipped"))' > /dev/null
          else
            echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
          fi

  # ---------------------------------------------------------------------------
  # macOS jobs.
  #
  # The `check` job runs everything on ubuntu-24.04, but several Band paths
  # behave differently on macOS. macOS runners are slow, and GitHub Free allows
  # 5 macOS jobs at a time, so a pull request or merge-queue run starts only
  # the jobs whose paths changed (scripts/ci/macos-changes.sh):
  #
  #   - `cli-macos`: the CLI integration tests (`cli`).
  #   - `machine-macos`: the hub tests listed in scripts/ci/macos-hub-tests.txt
  #     plus the host-local and worker package tests (`macos-machine`).
  #   - `simulator-macos`: the two iOS simulator tests (`simulator`).
  #   - `desktop-macos`: the Electron e2e (`desktop`), and
  #     `desktop-packaged-macos`: a smoke run of the packaged app when its
  #     packaging inputs changed (`desktop-package`).
  #   - `mobile-ios`: the iOS simulator build (`mobile`).
  #
  # A scheduled (nightly) or manual run starts every one of them in full, and
  # `web-macos` runs the whole hub suite on macOS. A push to main starts none:
  # the merge queue tested that commit. A macOS-only break outside the filtered
  # paths therefore shows up in the nightly run (Actions tab, workflow CI,
  # event "schedule"), not in the queue.
  #
  # A skipped job counts as passed for a required check, so the job names can be
  # required. Pull requests run none of the macOS jobs (every one has
  # `github.event_name != 'pull_request'`).
  # ---------------------------------------------------------------------------
  macos-changes:
    name: Detect macOS-relevant changes
    runs-on: ubuntu-24.04
    # Mirror the `check` job's cost gate: run in the merge queue, on same-repo
    # PRs (collaborators), on fork PRs a maintainer labelled `ci:approved`, and
    # on push to main (where it turns every job off) and the nightly run.
    if: >
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'ci:approved')
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      macos-machine: ${{ steps.filter.outputs.macos-machine }}
      simulator: ${{ steps.filter.outputs.simulator }}
      docker: ${{ steps.filter.outputs.docker }}
      desktop: ${{ steps.filter.outputs.desktop }}
      desktop-package: ${{ steps.filter.outputs.desktop-package }}
      mobile: ${{ steps.filter.outputs.mobile }}
      full-suite: ${{ steps.filter.outputs.full-suite }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so the base commit is reachable for the diff.
          fetch-depth: 0

      # The path lists live in scripts/ci/macos-changes.sh, which
      # scripts/ci/macos-changes.test.mjs covers. Native git diff, no
      # third-party action, in a workflow this repo runs under `pull_request`.
      # Fails OPEN: any ambiguity about the base turns the jobs on.
      - name: Detect macOS-relevant changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) export BASE="$PR_BASE" HEAD="$PR_HEAD" ;;
            merge_group) export BASE="$QUEUE_BASE" HEAD="$QUEUE_HEAD" ;;
          esac
          scripts/ci/macos-changes.sh | tee -a "$GITHUB_OUTPUT"

  # Builds docker/Dockerfile and starts the image. #743 turned the UI into a
  # static SPA whose shell is prerendered at build time. The prerender failed
  # silently inside the image, so it built fine and crashed at start with
  # ENOENT on _shell.html. Nothing else in CI builds the image.
  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    needs: macos-changes
    if: needs.macos-changes.outputs.docker == 'true'
    timeout-minutes: 40
    steps:
      - name: Free disk space
        # Both jobs build images of about 2 GB each, and the runner starts with roughly 14 GB free. Runs
        # 41156461496 (Docker image) and 41338577994 (k8s, kind) ended with "no space left on device".
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image
        # Tagged as the published name, so compose.yml pulls nothing and runs this build.
        run: docker build -f docker/Dockerfile -t band-check -t ghcr.io/band-app/band-hub:ci . 2>&1 | tee docker-build.log

      - name: Check the shell was prerendered
        run: |
          grep -E '\[prerender\] Prerendered [1-9][0-9]* pages' docker-build.log
          docker run --rm --entrypoint test band-check -f dist/client/_shell.html

      - name: Check gh is in the image
        # images.yml builds both images for amd64 and arm64, and their `RUN gh --version` fails the build without gh.
        run: docker run --rm --entrypoint gh band-check --version

      - name: Smoke-run the image
        run: |
          docker run -d --name band-smoke -p 3456:3456 -e BAND_ACCESS_TOKEN=ci-smoke band-check
          for i in $(seq 1 30); do
            code=$(curl -s -o page.html -w '%{http_code}' "http://localhost:3456/?token=ci-smoke" || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          if [ "$code" != 200 ] || ! grep -qi '<html' page.html; then
            echo "GET /?token=... returned $code" >&2
            docker logs band-smoke >&2
            exit 1
          fi
          test "$(docker inspect -f '{{.State.Running}}' band-smoke)" = true

      - name: Container logs
        if: failure()
        run: docker logs band-smoke || true

      # The headless deploy (plan step 2.7): the compose file in deploy/compose
      # runs the image just built, keeps its data in a volume and can serve the
      # hub as an API only.
      - name: Remove the smoke container
        if: always()
        run: docker rm -f band-smoke || true

      - name: Compose files resolve to the published image and the local build
        working-directory: deploy/compose
        env:
          BAND_VERSION: ci
        run: |
          docker compose config --images | grep -qx 'ghcr.io/band-app/band-hub:ci'
          docker compose -f compose.yml -f compose.build.yml config | grep -q 'dockerfile: docker/Dockerfile'

      - name: Compose up
        working-directory: deploy/compose
        env:
          BAND_VERSION: ci
          BAND_PORT: "3466"
          BAND_ADMIN_TOKEN: ci-compose-token
        run: |
          docker compose up -d --no-build
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' compose-band-1 2>/dev/null || true)
            [ "$status" = healthy ] && break
            sleep 2
          done
          test "$status" = healthy

      - name: Compose health, auth and UI
        run: |
          base=http://127.0.0.1:3466
          auth='Authorization: Bearer ci-compose-token'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$auth" $base/api/health)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' $base/api/health)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$auth" $base/)" = 200
          curl -s -H "$auth" "$base/trpc/repos.list" | grep -q '"result"'
          # Local worktrees are off by default, so there is no sample repo.
          if curl -s -H "$auth" "$base/trpc/repos.list" | grep -q sample; then echo 'sample repo registered'; exit 1; fi
          # The hub's own host takes no worktrees here, so the list leaves it out.
          curl -s -H "$auth" "$base/trpc/hosts.list" | grep -q '"result"'
          if curl -s -H "$auth" "$base/trpc/hosts.list" | grep -q '"id":"local"'; then echo 'local host listed'; exit 1; fi

      - name: Compose keeps data across a recreate
        working-directory: deploy/compose
        env:
          BAND_VERSION: ci
          BAND_PORT: "3466"
          BAND_ADMIN_TOKEN: ci-compose-token
        run: |
          auth='Authorization: Bearer ci-compose-token'
          # Add a repo the entrypoint knows nothing about.
          docker compose exec -T band sh -c 'mkdir -p /data/repos/persisted && cd /data/repos/persisted && git init -q && git commit -q --allow-empty -m init'
          # The image runs with BAND_LOCAL_HOST=off, which has no repo by path; a file URL needs no worker.
          docker compose exec -T band band repos add --url file:///data/repos/persisted --branch main
          curl -s -H "$auth" http://127.0.0.1:3466/trpc/repos.list | grep -q persisted
          docker compose down
          docker compose up -d --no-build
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' compose-band-1 2>/dev/null || true)
            [ "$status" = healthy ] && break
            sleep 2
          done
          test "$status" = healthy
          curl -s -H "$auth" http://127.0.0.1:3466/trpc/repos.list | grep -q persisted
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$auth" http://127.0.0.1:3466/api/health)" = 200

      - name: Compose with BAND_SERVE_UI=false
        working-directory: deploy/compose
        env:
          BAND_VERSION: ci
          BAND_PORT: "3466"
          BAND_ADMIN_TOKEN: ci-compose-token
          BAND_SERVE_UI: "false"
        run: |
          docker compose up -d --no-build --force-recreate
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' compose-band-1 2>/dev/null || true)
            [ "$status" = healthy ] && break
            sleep 2
          done
          test "$status" = healthy
          auth='Authorization: Bearer ci-compose-token'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$auth" http://127.0.0.1:3466/)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$auth" http://127.0.0.1:3466/api/health)" = 200

      - name: First run prints the admin token once
        working-directory: deploy/compose
        env:
          BAND_VERSION: ci
          BAND_PORT: "3466"
        run: |
          docker compose down -v
          docker compose up -d --no-build
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' compose-band-1 2>/dev/null || true)
            [ "$status" = healthy ] && break
            sleep 2
          done
          test "$status" = healthy
          token=$(docker compose logs band | grep -A1 'First run: admin token' | tail -1 | awk '{print $NF}')
          test -n "$token"
          test "$(docker compose logs band | grep -c "$token")" = 1
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" http://127.0.0.1:3466/api/health)" = 200
          docker compose restart band
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' compose-band-1 2>/dev/null || true)
            [ "$status" = healthy ] && break
            sleep 2
          done
          test "$status" = healthy
          test "$(docker compose logs band | grep -c "$token")" = 1
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" http://127.0.0.1:3466/api/health)" = 200

      # The worker image (plan step 2.6) against a hub container: a bootstrap
      # token from the hub's API, the image started with `--network host` (a
      # worker takes plain http only for a loopback hub), and the host listed
      # online through the API.
      - name: Build worker image
        run: docker build -f docker/worker.Dockerfile -t band-worker-check .

      - name: Worker image runs as a non-root user
        run: |
          test "$(docker run --rm --entrypoint id band-worker-check -u)" = 10001
          docker run --rm band-worker-check --help | grep -q -- '--hub <url>'

      # The desktop worker image (plan step 7.1): the worker image plus Xvfb, fluxbox and x11vnc. Its
      # entrypoint must start the display and x11vnc, and x11vnc must answer on loopback.
      - name: Build desktop worker image
        run: docker build -f docker/worker-desktop.Dockerfile --build-arg BASE_IMAGE=band-worker-check -t band-worker-desktop-check .

      - name: Desktop worker image runs as a non-root user with a display
        run: |
          test "$(docker run --rm --entrypoint id band-worker-desktop-check -u)" = 10001
          docker run --rm --entrypoint sh band-worker-desktop-check -c 'for b in Xvfb fluxbox x11vnc xdpyinfo chromium; do command -v $b || exit 1; done'

      - name: Hub for the worker
        working-directory: deploy/compose
        env:
          BAND_VERSION: ci
          BAND_PORT: "3466"
          BAND_ADMIN_TOKEN: ci-worker-hub-token
        run: |
          docker compose down -v
          docker compose up -d --no-build
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' compose-band-1 2>/dev/null || true)
            [ "$status" = healthy ] && break
            sleep 2
          done
          test "$status" = healthy

      - name: Worker image shows online in the hub
        run: |
          base=http://127.0.0.1:3466
          auth='Authorization: Bearer ci-worker-hub-token'
          issued=$(curl -sf -X POST -H "$auth" -H 'content-type: application/json' \
            -d '{"hostName":"CI worker image"}' "$base/trpc/tokens.issueWorkerBootstrap")
          token=$(echo "$issued" | jq -r '.result.data.token')
          host_id=$(echo "$issued" | jq -r '.result.data.hostId')
          test -n "$token" && test "$token" != null
          docker run -d --name band-worker-ci --network host \
            -e BAND_HUB_URL="$base" -e BAND_WORKER_TOKEN="$token" band-worker-check
          for i in $(seq 1 60); do
            status=$(curl -sf -H "$auth" "$base/trpc/hosts.list" \
              | jq -r --arg id "$host_id" '.result.data.hosts[] | select(.id == $id) | .status')
            [ "$status" = online ] && break
            sleep 2
          done
          if [ "$status" != online ]; then
            echo "host $host_id is '$status'" >&2
            docker logs band-worker-ci >&2
            exit 1
          fi

      - name: Worker image carries its own band CLI
        run: |
          docker run --rm band-worker-check band --version
          docker exec band-worker-ci band --version
          if docker logs band-worker-ci 2>&1 | grep -q 'no band CLI found'; then
            docker logs band-worker-ci >&2
            exit 1
          fi

      # The docker runner hook (plan step 3.6): a hub on this machine starts
      # workers from the image above through runners/docker, each in a hardened
      # container, and the test inspects the containers. `--network host` lets
      # the container reach the hub and a `git daemon` on loopback.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build hub
        run: pnpm --filter @band-app/server build

      # The snapshot and restore hooks (plan step 3.10) run in the same job: a container worktree
      # sleeps, its /work is snapshotted into an image, and the restored container has an untracked file.
      - name: Docker runner hook
        run: pnpm --filter @band-app/server exec vitest run tests/runner-docker.test.ts tests/runner-docker-snapshot.test.ts
        env:
          BAND_DOCKER_TEST_IMAGE: band-worker-check
          BAND_DOCKER_TEST_NETWORK: host

      # The desktop image through the hub (plan step 7.1): the `desktop` capability, an RFB handshake from
      # x11vnc over the link, a real framebuffer through the view-only bridge (step 7.2), and DISPLAY plus
      # xdpyinfo in a terminal on the worker.
      - name: Desktop worker
        run: |
          pnpm --filter @band-app/server exec vitest run tests/desktop-docker.test.ts \
            --reporter=default --reporter=json --outputFile.json=/tmp/desktop-docker.json
          # 7.1 S1, S2 and 7.2 S1 must run with the real image: a skipped or missing test fails the job.
          node -e '
            const r = JSON.parse(require("fs").readFileSync("/tmp/desktop-docker.json", "utf8"));
            if (r.numPassedTests < 4 || r.numPendingTests > 0 || r.numFailedTests > 0) {
              console.error("desktop-docker.test.ts did not run all 4 tests:", r.numPassedTests, "passed,", r.numPendingTests, "skipped");
              process.exit(1);
            }'
        env:
          BAND_DOCKER_TEST_DESKTOP_IMAGE: band-worker-desktop-check
          BAND_DOCKER_TEST_NETWORK: host

      - name: Remove runner containers
        if: always()
        run: |
          docker ps --all --quiet --filter label=band.runner=docker | xargs -r docker rm --force --volumes
          docker ps --all --quiet --filter label=band.runner=desktop | xargs -r docker rm --force --volumes
          docker ps --all --quiet --filter label=band.runner=docker-hib | xargs -r docker rm --force --volumes
          docker images --quiet --filter label=band.runner=docker-hib | sort -u | xargs -r docker rmi --force

      - name: Worker logs
        if: failure()
        run: docker logs band-worker-ci || true

      - name: Remove the worker container
        if: always()
        run: docker rm -f band-worker-ci || true

      - name: Compose logs
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs || true

      - name: Compose down
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v || true

  # The k8s runner hook (plan step 3.9) against a real cluster. kind runs in docker on this runner.
  # S3: deploy/k8s/check-rbac.sh asks `kubectl auth can-i` what the band-hub service account may do.
  # S2: runner-k8s-kind.test.ts boots a hub behind a self-signed TLS terminator, starts the worker
  # image as a Pod through runners/k8s (as that service account), waits for the worker's hello, and
  # destroys it. Pods reach the hub at the gateway of docker's `kind` network.
  k8s:
    name: k8s (kind)
    runs-on: ubuntu-24.04
    needs: macos-changes
    if: needs.macos-changes.outputs.docker == 'true'
    timeout-minutes: 25
    steps:
      - name: Free disk space
        # Both jobs build images of about 2 GB each, and the runner starts with roughly 14 GB free. Runs
        # 41156461496 (Docker image) and 41338577994 (k8s, kind) ended with "no space left on device".
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build worker image
        run: docker build -f docker/worker.Dockerfile -t band-worker:ci .

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: band-k8s

      - name: Load worker image into the cluster
        run: kind load docker-image band-worker:ci --name band-k8s

      - name: Apply namespace and RBAC
        run: kubectl apply -f deploy/k8s/namespace.yaml -f deploy/k8s/rbac.yaml

      - name: RBAC allows only what the runner needs (S3)
        run: deploy/k8s/check-rbac.sh

      - name: Write the admin kubeconfig
        run: kubectl config view --raw --minify > "$GITHUB_WORKSPACE/kind-kubeconfig"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build hub
        run: pnpm --filter @band-app/server build

      - name: k8s runner hook on kind (S2)
        run: pnpm --filter @band-app/server exec vitest run tests/runner-k8s-kind.test.ts
        env:
          BAND_K8S_TEST_IMAGE: band-worker:ci
          BAND_K8S_TEST_KUBECONFIG: ${{ github.workspace }}/kind-kubeconfig

      - name: Cluster state
        if: failure()
        run: |
          kubectl get pods,secrets,configmaps -n band-workers -o wide || true
          kubectl describe pods -n band-workers || true

  cli-macos:
    name: CLI Integration Tests (macOS)
    runs-on: macos-latest
    # A hung test must not hold the job for the 6 hour default.
    timeout-minutes: 45
    needs: macos-changes
    if: github.event_name != 'pull_request' && needs.macos-changes.outputs.cli == 'true'
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `runner.os` is "macOS" here, so these keys are naturally distinct from
      # the ubuntu `check` job's `Linux` cache entries — no cross-OS collision.
      # See the `check` job for the full restore/save rationale; keep each
      # Restore/Save pair's path & key in lock-step.
      - name: Restore Cargo registry cache
        id: cache-cargo-registry
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Restore CLI target cache
        id: cache-cargo-cli
        uses: actions/cache/restore@v5
        with:
          path: apps/cli/target
          key: cargo-cli-${{ runner.os }}-${{ hashFiles('apps/cli/Cargo.lock') }}
          restore-keys: cargo-cli-${{ runner.os }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # macos-latest ships node-pty's darwin prebuild, so (unlike the ubuntu
      # job) no explicit `node-gyp` install is needed — matches release.yml.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the web server bundle the integration tests drive: each test
      # boots `apps/hub/dist/start-server.mjs` (a real node Band server) and
      # runs CLI commands against it. The CLI binary itself is compiled by the
      # `cargo test` step below via `env!("CARGO_BIN_EXE_band")` (test profile),
      # so — unlike the `check`/`release` jobs — there is deliberately NO
      # separate `cargo build --release` step here: those jobs release-build the
      # CLI only so their *web* tests can shell out to a real `band` on PATH,
      # and this CLI-only job runs no web tests. Dropping the release build
      # avoids compiling the crate twice on the slower/costlier macOS runner
      # (the exact cost #609 asks us to economise on).
      - name: Build web (needed by tests)
        run: pnpm build:web

      # Keep --test-threads=4 (matching ci.yml `check` and release.yml): each
      # test boots its own real Band server on a random port, and unbounded
      # parallelism floods the slower macOS runner so servers aren't ready when
      # `worktrees create` dispatches, flaking the worktree-dependent tests.
      - name: Test (CLI)
        run: cargo test --manifest-path apps/cli/Cargo.toml -- --test-threads=4

      # Cache writes, gated on trusted events as defence-in-depth — same policy
      # and failure semantics as the `check` job (registry saves `always()`,
      # CLI target only on `success()` so broken incremental state isn't cached).
      - name: Save Cargo registry cache
        if: |
          always() &&
          steps.cache-cargo-registry.outputs.cache-hit != 'true' &&
          ((github.event_name != 'pull_request' &&
            github.event_name != 'pull_request_target') ||
           github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Save CLI target cache
        if: |
          steps.cache-cargo-cli.outputs.cache-hit != 'true' &&
          ((github.event_name != 'pull_request' &&
            github.event_name != 'pull_request_target') ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@v5
        with:
          path: apps/cli/target
          key: cargo-cli-${{ runner.os }}-${{ hashFiles('apps/cli/Cargo.lock') }}

  web-macos:
    name: Web Tests (macOS) ${{ matrix.shard }}/${{ matrix.total }}
    runs-on: macos-latest
    # A hung test must not hold the job for the 6 hour default.
    timeout-minutes: 45
    needs: macos-changes
    # The whole hub suite on macOS: nightly, manual runs and edits to this
    # workflow only. A merge starts `machine-macos` instead.
    if: github.event_name != 'pull_request' && needs.macos-changes.outputs.full-suite == 'true'
    # Two shards of the hub suite (vitest splits by file) halve the wall time of
    # the merge queue's longest job. Both shards use the same cache keys. Do not
    # add a third: macOS allows 5 concurrent jobs.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        total: [2]
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Same restore/save split and trust gate as the `check` job; keep each
      # Restore/Save pair's path & key in lock-step. The CLI target cache has
      # its own key: this job release-builds the CLI while `cli-macos` fills
      # `cargo-cli-macOS-*` with a test-profile build, and whichever saved
      # first would leave the other compiling from scratch every run. The
      # fallback restore-key still reuses that cache's dependencies.
      - name: Restore Cargo registry cache
        id: cache-cargo-registry
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Restore CLI release target cache
        id: cache-cargo-cli
        uses: actions/cache/restore@v5
        with:
          path: apps/cli/target
          key: cargo-cli-release-${{ runner.os }}-${{ hashFiles('apps/cli/Cargo.lock') }}
          restore-keys: |
            cargo-cli-release-${{ runner.os }}-
            cargo-cli-${{ runner.os }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        id: cache-pnpm-store
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # macos-latest ships node-pty's darwin prebuild, so (unlike the ubuntu
      # job) no explicit `node-gyp` install is needed — matches release.yml.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Save pnpm store cache
        if: |
          steps.cache-pnpm-store.outputs.cache-hit != 'true' &&
          ((github.event_name != 'pull_request' &&
            github.event_name != 'pull_request_target') ||
           github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Some web tests (e.g. `cli-skills.test.ts`) shell out to a real `band`
      # binary, so build it first, as `check`, release.yml and nightly.yml do.
      - name: Build CLI
        run: cargo build --release --manifest-path apps/cli/Cargo.toml

      - name: Build web (needed by tests)
        run: pnpm build:web

      # `pnpm build:web` above already built the web app and the hub bundle, so the hub
      # suite runs through vitest directly: `pnpm --filter @band-app/server test` would
      # rebuild both in its `pretest`.
      - name: Test (web)
        env:
          BAND_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/band-test-artifacts
          NODE_OPTIONS: "--max-old-space-size=6144 --no-warnings=ExperimentalWarning"
        run: |
          pnpm --filter @band-app/server exec vitest run --shard=${{ matrix.shard }}/${{ matrix.total }}
          # The web unit and package suites are small; shard 1 runs them once.
          if [ "${{ matrix.shard }}" != "1" ]; then exit 0; fi
          pnpm --filter @band-app/web test
          pnpm --filter @band-app/link test
          pnpm --filter @band-app/environment test
          pnpm --filter @band-app/client test
          pnpm --filter @band-app/shared test
          pnpm --filter @band-app/host-local test
          pnpm --filter @band-app/worker test

      - name: Upload hub failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-macos-failure-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/band-test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save Cargo registry cache
        if: |
          always() &&
          steps.cache-cargo-registry.outputs.cache-hit != 'true' &&
          ((github.event_name != 'pull_request' &&
            github.event_name != 'pull_request_target') ||
           github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Save CLI release target cache
        if: |
          steps.cache-cargo-cli.outputs.cache-hit != 'true' &&
          ((github.event_name != 'pull_request' &&
            github.event_name != 'pull_request_target') ||
           github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: apps/cli/target
          key: cargo-cli-release-${{ runner.os }}-${{ hashFiles('apps/cli/Cargo.lock') }}

