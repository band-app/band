          BAND_TEST_SIMULATOR: "1"
          BAND_SIMULATOR_MAX_BOOTED: "1"
        run: pnpm --filter @band-app/web exec playwright test e2e/simulator-panel.spec.ts -g "S3, S6"

      - name: Upload hub failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-macos-failure-logs
          path: ${{ runner.temp }}/band-test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-simulator-macos-test-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save Cargo registry cache
        if: |
          always() &&
          steps.cache-cargo-registry.outputs.cache-hit != 'true' &&
          ((github.event_name != 'pull_request' &&
            github.event_name != 'pull_request_target') ||
           github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Save CLI release target cache
        if: |
          steps.cache-cargo-cli.outputs.cache-hit != 'true' &&
          ((github.event_name != 'pull_request' &&
            github.event_name != 'pull_request_target') ||
           github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: apps/cli/target
          key: cargo-cli-release-${{ runner.os }}-${{ hashFiles('apps/cli/Cargo.lock') }}

  # Builds apps/mobile for the iOS simulator (expo prebuild, pod install,
  # xcodebuild Release with the JS bundle embedded). The Maestro flows in
  # apps/mobile/e2e are not run here yet; agents and people run them locally
  # with the mobile-verify skill.
  mobile-ios:
    name: Mobile iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 45
    needs: macos-changes
    if: github.event_name != 'pull_request' && needs.macos-changes.outputs.mobile == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for the iOS simulator
        run: node apps/mobile/scripts/build-ios-sim.mjs Release

      # The Linux jobs skip this test: it replays recorded terminal sessions through SwiftTerm
      # and compares the screens with xterm.js, which needs the Swift toolchain.
      - name: Replay recorded terminals through SwiftTerm
        run: node --experimental-strip-types --test apps/mobile/tests/terminal-replay.test.ts

  # Drives the real Electron app with Playwright's `_electron`: the bundled UI
  # over app://, the local hub it spawns, a remote hub on another port, the hub
  # picker, the CSP and the navigation guard. Needs a display, which the macOS
  # runner has.
  desktop-macos:
    name: Desktop e2e (macOS)
    runs-on: macos-latest
    # A hung test must not hold the job for the 6 hour default.
    timeout-minutes: 45
    needs: macos-changes
    if: github.event_name != 'pull_request' && needs.macos-changes.outputs.desktop == 'true'
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The hub's tests and the e2e helpers shell out to a real `band` binary.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build CLI
        run: cargo build --release --manifest-path apps/cli/Cargo.toml

      - name: Build the hub and the UI
        run: pnpm build:web

      - name: Build desktop (TypeScript main + preload)
        run: pnpm --filter @band-app/desktop build

      - name: Test e2e (desktop)
        run: pnpm --filter @band-app/web test:e2e:desktop

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-desktop-test-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The same Electron e2e as `desktop-macos`, against the electron-builder
  # output instead of the dev tree: it proves the packaged app starts, loads
  # the bundled UI from app://, spawns the hub from its Resources/ and shows
  # the dashboard. Unsigned and unnotarised, no DMG, nothing published.
  # On a merge it runs only when the packaging inputs changed, and only as a
  # smoke check: the app starts from the bundle and connects to a hub, and the
  # bundled worker installs. The nightly run (`full-suite`) runs every spec.
  desktop-packaged-macos:
    name: Desktop e2e, packaged app (macOS)
    runs-on: macos-latest
    # A hung test must not hold the job for the 6 hour default.
    timeout-minutes: 45
    needs: macos-changes
    if: github.event_name != 'pull_request' && needs.macos-changes.outputs.desktop-package == 'true'
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Builds the CLI and copies it to apps/desktop/binaries/band, which
      # electron-builder ships as an extraResource.
      - name: Build and stage the CLI
        run: pnpm build:cli:desktop

      - name: Build the hub and the UI
        run: pnpm build:web

      # electron-builder ships apps/worker/dist-desktop as Resources/worker.
      - name: Build the worker for the app
        run: pnpm --filter @band-app/worker build:desktop

      - name: Build desktop (TypeScript main + preload)
        run: pnpm --filter @band-app/desktop build

      - name: Package the app (unpacked, unsigned)
        run: pnpm --filter @band-app/desktop package:dir --mac --arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          SKIP_NOTARIZE: "1"
          SKIP_NATIVE_SIGN: "1"
          ELECTRON_BUILDER_PUBLISH: never

      - name: Test e2e (packaged desktop app)
        run: |
          EXE="$PWD/apps/desktop/dist-builder/mac-arm64/Band.app/Contents/MacOS/Band"
          test -x "$EXE"
          if [ "$FULL_SUITE" = "true" ]; then
            BAND_DESKTOP_EXECUTABLE="$EXE" pnpm --filter @band-app/web test:e2e:desktop
          else
            # Smoke: the app starts from the bundle, spawns its hub and loads the UI,
            # and the bundled worker installs and goes online on a remote hub.
            BAND_DESKTOP_EXECUTABLE="$EXE" pnpm --filter @band-app/web test:e2e:desktop \
              -g "local hub: loads app://|S1: connecting to a remote hub"
          fi
        env:
          FULL_SUITE: ${{ needs.macos-changes.outputs.full-suite }}

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-desktop-packaged-test-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Second required check for the merge queue. The macOS jobs, the Docker image
  # and the k8s (kind) job are path-filtered, so they are skipped on PRs that do
  # not touch what they cover, and on a push to main. Unlike `lint-test-build`, a skipped needed job
  # passes here and only a failed or cancelled one fails the check. `deploy-docs`
  # is left out: it runs on push to main only. Same fork gate as the jobs it
  # waits for.
  all-platforms:
    name: macOS, Docker & k8s
    runs-on: ubuntu-24.04
    needs:
      - macos-changes
      - docker
      - k8s
      - cli-macos
      - web-macos
      - machine-macos
      - simulator-macos
      - mobile-ios
      - desktop-macos
      - desktop-packaged-macos
    if: >
      always() && (
      github.event_name == 'merge_group' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'ci:approved'))
    steps:
      - name: Require every platform job to succeed or be skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null

  deploy-docs:
    name: Deploy Docs
    runs-on: ubuntu-24.04
    # The merge queue tested this commit before it landed, so no test job
    # gates the deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check for docs changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- apps/website/ docs/ || true)
          if [ -z "$CHANGED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.changes.outputs.changed == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          # deploy-docs only runs on push to main, so this ungated save
          # never runs for untrusted code.
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build docs
        if: steps.changes.outputs.changed == 'true'
        run: pnpm --filter @band-app/docs build
        env:
          # PostHog analytics — public-by-design project key, safe to expose in
          # the built bundle but kept in secrets for parity with other config.
          # Astro inlines PUBLIC_* env vars at build time, so they must be set
          # here (Cloudflare Pages dashboard vars do NOT apply — we only upload
          # the prebuilt dist/ to Pages, we don't build on Pages).
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}

      - name: Deploy to Cloudflare Pages
        if: steps.changes.outputs.changed == 'true'
        run: npx wrangler pages deploy apps/website/dist --project-name=band-docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
