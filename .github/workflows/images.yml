name: Images

# Builds the hub and worker images for amd64 and arm64, each on a runner of its
# own architecture. release.yml calls it with push: true. A pull request that
# touches the Dockerfiles, the compose files or this workflow runs it as a
# dry run: everything is built, nothing is pushed.
on:
  workflow_call:
    inputs:
      version:
        description: "Release version, without the leading v"
        required: true
        type: string
      ref:
        description: "Git ref to build"
        required: true
        type: string
      push:
        description: "Push to ghcr.io"
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - "docker/**"
      - "deploy/compose/**"
      - ".dockerignore"
      - ".github/workflows/release.yml"
      - ".github/workflows/images.yml"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/band-app
  VERSION: ${{ inputs.version || '0.0.0-dryrun' }}
  PUSH: ${{ inputs.push && 'true' || 'false' }}

jobs:
  build:
    name: Build ${{ matrix.image }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [band-hub, band-worker]
        arch: [amd64, arm64]
        include:
          - image: band-hub
            file: docker/Dockerfile
          - image: band-worker
            file: docker/worker.Dockerfile
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          build-args: BAND_VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
          outputs: ${{ env.PUSH == 'true' && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, matrix.image) || 'type=cacheonly' }}

      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # One manifest list per image, tagged with the version and latest, that
  # points at the two single-architecture images.
  manifest:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: build
    if: inputs.push
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [band-hub, band-worker]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION is not a plain semver: $VERSION" >&2; exit 1; }
          image="$REGISTRY/${{ matrix.image }}"
          docker buildx imagetools create \
            --tag "$image:$VERSION" --tag "$image:latest" \
            $(printf "$image@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "$REGISTRY/${{ matrix.image }}:$VERSION"
