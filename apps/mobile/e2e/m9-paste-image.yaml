# S9: text on the clipboard pastes as text with no chip. An image on the clipboard, pasted with
# long-press > Paste in the field, becomes an attachment chip with no text inserted, and is sent;
# the agent gets an image part.
appId: app.getband.mobile
name: S9 paste an image
---
- addMedia:
    - assets/photo.png
- runFlow: subflows/pair-link.yaml
- runFlow:
    file: subflows/open-gamma.yaml
    env:
      WT: gamma-paste
# Text on the clipboard pastes as text and adds no chip.
- tapOn:
    id: composer__input
- inputText: "plain text"
- copyTextFrom:
    id: composer__input
- eraseText: 20
- longPressOn:
    id: composer__input
- tapOn: "Paste"
- assertVisible:
    id: composer__input
    text: "plain text"
- assertNotVisible:
    id: composer__attachment
- eraseText: 20
- hideKeyboard
# Copy the newest photo in Photos, which puts an image on the clipboard.
- launchApp:
    appId: com.apple.mobileslideshow
    clearState: false
- tapOn:
    point: "15%,25%"
# The first tap opened the photo full screen; its share sheet has Copy Photo.
- tapOn:
    point: "13%,94%"
- tapOn: "Copy Photo"
- launchApp:
    appId: app.getband.mobile
    clearState: false
# The app comes back on the home screen.
- runFlow:
    file: subflows/open-gamma.yaml
    env:
      WT: gamma-paste
- tapOn:
    id: composer__input
- longPressOn:
    id: composer__input
- tapOn: "Paste"
- runFlow:
    when:
      visible: "Allow Paste"
    commands:
      - tapOn: "Allow Paste"
- extendedWaitUntil:
    visible:
      id: composer__attachment
    timeout: 20000
- assertVisible:
    id: composer__input
    text: "Follow up…"
- takeScreenshot: m9-pasted
- tapOn:
    id: composer__input
- inputText: "what is in this paste"
- tapOn:
    id: composer__send
- extendedWaitUntil:
    visible:
      text: "Done."
    timeout: 20000
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: expect-prompt?image=1
      VALUE: "what is in this paste"
