# S9: text on the clipboard pastes as text with no chip. An image on the clipboard, pasted with
# long-press > Paste in the field, becomes an attachment chip with no text inserted, and is sent;
# the agent gets an image part.
appId: app.getband.mobile
name: S9 paste an image
---
- addMedia:
    - assets/photo.png
- runFlow: subflows/pair-link.yaml
- runFlow:
    file: subflows/open-gamma.yaml
    env:
      WT: gamma-paste
# Text on the clipboard pastes as text and adds no chip.
- tapOn:
    id: composer__input
- inputText: "plain text"
# copyTextFrom only fills a Maestro variable. Cut puts the text on the iOS pasteboard.
- longPressOn:
    id: composer__input
- tapOn: "Select All"
- tapOn: "Cut"
- longPressOn:
    id: composer__input
- tapOn: "Paste"
- assertVisible:
    id: composer__input
    text: "plain text"
- assertNotVisible:
    id: composer__attachment
- eraseText: 20
- hideKeyboard
# Copy the newest photo in Photos, which puts an image on the clipboard.
- launchApp:
    appId: com.apple.mobileslideshow
    clearState: false
# Photos may reopen on the grid or on the full-screen photo it showed last time.
- runFlow:
    when:
      notVisible: "Share"
    commands:
      - tapOn:
          point: "15%,25%"
# The full-screen photo's share sheet has Copy Photo.
- tapOn: "Share"
- tapOn: "Copy Photo"
- launchApp:
    appId: app.getband.mobile
    clearState: false
# The app comes back on the home screen.
- runFlow:
    file: subflows/open-gamma.yaml
    env:
      WT: gamma-paste
- tapOn:
    id: composer__input
- longPressOn:
    id: composer__input
- tapOn: "Paste"
- runFlow:
    when:
      visible: "Allow Paste"
    commands:
      - tapOn: "Allow Paste"
- extendedWaitUntil:
    visible:
      id: composer__attachment
    timeout: 20000
# The placeholder is not matchable by text, so "no text inserted" is proved by the exact prompt
# the hub receives below.
- takeScreenshot: m9-pasted
- tapOn:
    id: composer__input
- inputText: "what is in this paste"
- tapOn:
    id: composer__send
- extendedWaitUntil:
    visible:
      text: "Done."
    timeout: 20000
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: expect-prompt?image=1
      VALUE: "what is in this paste"
