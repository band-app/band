# mq3 (S3, S4): auto-merge armed before the PR is queued shows as on, and the PR still offers Merge.
appId: app.getband.mobile
name: mq3 auto-merge on the Checks screen
---
- runFlow: subflows/pair-link.yaml
- runFlow:
    file: subflows/open-checks.yaml
    env:
      WT: widgets-feat-automerge
- extendedWaitUntil:
    visible:
      id: checks__auto-merge
      text: "Auto-merge on, waiting for checks"
    timeout: 20000
- assertNotVisible:
    id: checks__merge-queue
- assertVisible:
    id: checks__merge
- takeScreenshot: mq3-auto-merge
