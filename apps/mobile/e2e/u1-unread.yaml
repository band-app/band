# U1: an idle worktree is marked unread from the long-press sheet, shows the unread dot, and is marked read again.
appId: app.getband.mobile
name: U1 mark a worktree unread and read
---
- runFlow: subflows/pair-link.yaml
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: make-worktree?repo=alpha&branch=unread-mark
- pressKey: home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: home__repo-alpha
    timeout: 20000
- swipe:
    start: 50%, 30%
    end: 50%, 70%
- extendedWaitUntil:
    visible:
      id: home__worktree-alpha-unread-mark
    timeout: 20000
# A fresh worktree is idle with no mark.
- assertVisible:
    id: home__state-alpha-unread-mark
- assertNotVisible: "Unread"
- takeScreenshot: u1-before
- longPressOn:
    id: home__worktree-alpha-unread-mark
- assertVisible: Mark as unread
- takeScreenshot: u1-sheet-unread
- tapOn: Mark as unread
- extendedWaitUntil:
    visible: "Unread"
    timeout: 20000
- takeScreenshot: u1-after
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: expect-worktree?repo=alpha&name=unread-mark&unread=1
# The sheet now offers the opposite action; Mark as read clears the dot.
- longPressOn:
    id: home__worktree-alpha-unread-mark
- assertVisible: Mark as read
- takeScreenshot: u1-sheet-read
- tapOn: Mark as read
- extendedWaitUntil:
    notVisible: "Unread"
    timeout: 20000
- takeScreenshot: u1-cleared
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: expect-worktree?repo=alpha&name=unread-mark&unread=0
