# t1 (S1): the worktree's three chats, open as tabs on the "web" (the seeded shared tab list), show
# on the phone in the same order with the same active tab. The terminal and browser tabs between
# them are not shown; the strip says they are on the desktop.
appId: app.getband.mobile
name: t1 the web's chat tabs open on the phone
---
- runFlow: subflows/pair-link.yaml
- runFlow:
    file: subflows/open-gamma.yaml
    env:
      WT: gamma-tabs
- extendedWaitUntil:
    visible:
      id: tabs__tab-chat_tabs_1
      text: "Parser"
    timeout: 15000
- assertVisible:
    id: tabs__tab-chat_tabs_2
    text: "Docs"
    rightOf:
      id: tabs__tab-chat_tabs_1
- assertVisible:
    id: tabs__tab-chat_tabs_3
    text: "Tests"
    rightOf:
      id: tabs__tab-chat_tabs_2
# Docs is the web's active tab: it is selected, and its (empty) chat is the one shown.
- assertVisible:
    id: tabs__tab-chat_tabs_2
    selected: true
- assertVisible:
    id: chat__empty
- assertVisible:
    id: tabs__hidden
    text: "2 more on desktop"
- takeScreenshot: t1-tabs
- tapOn:
    id: tabs__switcher
- extendedWaitUntil:
    visible:
      id: tabs__sheet
    timeout: 5000
- takeScreenshot: t1-switcher
- tapOn:
    id: tabs__sheet-done
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: check-tabs?wt=gamma-tabs&chats=3&active=chat_tabs_2
