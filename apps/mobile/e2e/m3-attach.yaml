# S3: a photo from the simulator's library is attached and sent; the agent gets an image part.
appId: app.getband.mobile
name: S3 attach a photo
---
- addMedia:
    - assets/photo.png
- runFlow: subflows/pair-link.yaml
- runFlow:
    file: subflows/open-gamma.yaml
    env:
      WT: gamma-attach
- tapOn:
    id: composer__attach
- tapOn: "Photo library"
# The system picker lists the newest photo first (the one addMedia added). Pick it, then confirm.
- extendedWaitUntil:
    visible: "Select Photos"
    timeout: 15000
- tapOn:
    point: "15%,25%"
- tapOn:
    point: "90%,11%"
- extendedWaitUntil:
    visible:
      id: composer__attachment
    timeout: 20000
- takeScreenshot: m3-attached
- tapOn:
    id: composer__input
- inputText: "what is in this photo"
- tapOn:
    id: composer__send
- extendedWaitUntil:
    visible:
      text: "Done."
    timeout: 20000
- takeScreenshot: m3-sent
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: expect-prompt?image=1
      VALUE: "what is in this photo"
