# k1 (S1): Views > Checks lists the pull request's checks with name, state and duration, counts
# them, and shows a check that finishes without a reload.
appId: app.getband.mobile
name: k1 the checks of a pull request, live
---
- runFlow: subflows/pair-link.yaml
- runFlow:
    file: subflows/open-gamma.yaml
    env:
      WT: widgets-feat-checks
- tapOn:
    id: worktree__more
- extendedWaitUntil:
    visible:
      id: views__sheet
    timeout: 5000
- takeScreenshot: k1-views-sheet
- tapOn:
    id: views__checks
- extendedWaitUntil:
    visible:
      id: checks__list
    timeout: 20000
- assertVisible:
    id: checks__subtitle
    text: ".*PR #42.*"
- assertVisible:
    id: checks__check-Lint
    text: ".*Successful.*2m 14s.*"
- assertVisible:
    id: checks__check-Unit
    text: ".*Failed.*"
- assertVisible:
    id: checks__check-Build
    text: ".*In progress.*Running for.*"
- assertVisible:
    id: checks__check-Deploy
    text: ".*Queued.*"
- assertVisible:
    id: checks__count-passing
    text: "1 passing"
- assertVisible:
    id: checks__count-failing
    text: "2 failing"
- assertVisible:
    id: checks__count-pending
    text: "2 pending"
- takeScreenshot: k1-checks
# Build finishes on GitHub; the list reads it again without a pull to refresh.
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: checks-finish-build
- extendedWaitUntil:
    visible:
      id: checks__check-Build
      text: ".*Successful.*1m 40s.*"
    timeout: 60000
- assertVisible:
    id: checks__count-passing
    text: "2 passing"
- assertVisible:
    id: checks__count-pending
    text: "1 pending"
- takeScreenshot: k1-checks-build-passed
