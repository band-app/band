# t5 (S5): renaming a tab names its chat on the hub; closing a chat tab removes the chat and its
# tab, and keeps the web's terminal and browser tabs in the shared list.
appId: app.getband.mobile
name: t5 rename and close a tab
---
- runFlow: subflows/pair-link.yaml
- runFlow:
    file: subflows/open-gamma.yaml
    env:
      WT: gamma-tabs
- extendedWaitUntil:
    visible:
      id: tabs__switcher
    timeout: 15000
# Rename from the switcher sheet: a long press on a row offers the same menu as the strip.
- tapOn:
    id: tabs__switcher
- longPressOn:
    id: tabs__sheet-tab-chat_tabs_1
- tapOn:
    text: Rename
- eraseText: 20
- inputText: "Parser v2"
- takeScreenshot: t5-rename
- tapOn:
    text: OK
- extendedWaitUntil:
    visible:
      text: "Parser v2"
    timeout: 10000
- tapOn:
    id: tabs__sheet-tab-chat_tabs_1
- extendedWaitUntil:
    visible:
      id: tabs__tab-chat_tabs_1
      text: "Parser v2"
    timeout: 10000
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: check-tabs?wt=gamma-tabs
      VALUE: "chat_tabs_1:Parser v2"
# Close from the strip: show Tests so the strip scrolls it into view, then long-press it.
- runFlow:
    file: subflows/select-tab.yaml
    env:
      CHAT: chat_tabs_3
- longPressOn:
    id: tabs__tab-chat_tabs_3
- takeScreenshot: t5-tab-menu
- tapOn:
    text: Close tab
- extendedWaitUntil:
    notVisible:
      id: tabs__tab-chat_tabs_3
    timeout: 10000
- assertVisible:
    id: tabs__hidden
    text: "2 more on desktop"
- takeScreenshot: t5-closed
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: check-tabs?wt=gamma-tabs&lacks=chat_tabs_3&has=chat_tabs_1,chat_tabs_2&keep=3f0c6a52-6a1e-4b5e-9d2a-1c1f0e7a9b10,browser_tabs_1
