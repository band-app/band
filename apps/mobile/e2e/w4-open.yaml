# S4: tapping a worktree opens its screen, and Back returns to the same place in a long list.
appId: app.getband.mobile
name: S4 open a worktree and come back
---
- runFlow: subflows/pair-link.yaml
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: fill?n=12
- pressKey: home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: home__repo-alpha
    timeout: 20000
# Pull to refresh brings the new worktrees in.
- swipe:
    start: 50%, 30%
    end: 50%, 70%
- scrollUntilVisible:
    element:
      id: home__worktree-alpha-bulk-9
    timeout: 30000
- takeScreenshot: s4-scrolled-list
- tapOn:
    id: home__worktree-alpha-bulk-9
- extendedWaitUntil:
    visible:
      id: worktree__screen
    timeout: 10000
# The title pill's second line names the repo and branch.
- assertVisible:
    id: tabs__switcher
    text: ".*alpha · bulk-9.*"
- takeScreenshot: s4-worktree-screen
- tapOn:
    id: worktree__back
- extendedWaitUntil:
    visible:
      id: home__worktree-alpha-bulk-9
    timeout: 10000
- takeScreenshot: s4-back-at-same-position
