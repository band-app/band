# The copy button under a message copies it at once and shows a check, like the web's message actions.
# A long press on the text selects a range instead, see c7-select.yaml.
appId: app.getband.mobile
name: S5 the copy button copies the message
---
- runFlow: subflows/pair-link.yaml
- runFlow:
    file: subflows/open-gamma.yaml
    env:
      WT: gamma-main
- extendedWaitUntil:
    visible:
      id: chat__list
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "showcase: fix the parser radix"
    direction: UP
    timeout: 20000
- tapOn:
    id: chat__message-copy
    below:
      text: "showcase: fix the parser radix"
# No sheet opens; the icon turns into a check.
- assertNotVisible:
    text: "Cancel"
- assertVisible:
    id: chat__message-copy
- takeScreenshot: s5-copied
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: clipboard
      VALUE: "showcase: fix the parser radix"
