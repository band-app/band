# A long press on a message opens its actions (web's message actions: Copy, and when it was sent).
appId: app.getband.mobile
name: S4 long press opens the message actions
---
- runFlow: subflows/pair-link.yaml
- runFlow:
    file: subflows/open-gamma.yaml
    env:
      WT: gamma-main
- extendedWaitUntil:
    visible:
      id: chat__list
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "showcase: fix the parser radix"
    direction: UP
    timeout: 20000
- longPressOn:
    text: "showcase: fix the parser radix"
# The sheet shows when the message was sent, and Copy.
- assertVisible:
    text: "Copy"
- assertVisible:
    text: ".*(just now|ago)"
- takeScreenshot: s4-actions
- tapOn:
    text: "Copy"
- takeScreenshot: s4-copied
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: clipboard
      VALUE: "showcase: fix the parser radix"
