# S5: a long press on a message copies its text. (S4 copies an agent message and compares it
# with the hub's.)
appId: app.getband.mobile
name: S5 long press copies a message
---
- runFlow: subflows/pair-link.yaml
- runFlow:
    file: subflows/open-gamma.yaml
    env:
      WT: gamma-main
- extendedWaitUntil:
    visible:
      id: chat__list
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "showcase: fix the parser radix"
    direction: UP
    timeout: 20000
- longPressOn:
    text: "showcase: fix the parser radix"
# Maestro holds a long press for about 3 s, longer than the "Copied" note stays; the clipboard
# check below is the proof.
- takeScreenshot: s5-copied
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: clipboard
      VALUE: "showcase: fix the parser radix"
