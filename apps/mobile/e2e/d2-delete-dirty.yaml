# D2: a worktree with uncommitted changes names them in the alert; Cancel keeps the worktree and
# its files, Delete anyway removes it.
appId: app.getband.mobile
name: D2 delete a dirty worktree
---
- runFlow: subflows/pair-link.yaml
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: make-worktree?repo=alpha&branch=del-dirty&dirty=1
- pressKey: home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: home__repo-alpha
    timeout: 20000
- swipe:
    start: 50%, 30%
    end: 50%, 70%
- extendedWaitUntil:
    visible:
      id: home__worktree-alpha-del-dirty
    timeout: 30000
# The branch poller reports the dirty file within a few seconds; the alert needs it.
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: sleep?ms=10000
- longPressOn:
    id: home__worktree-alpha-del-dirty
- tapOn: Delete worktree
- assertVisible: "Delete del-dirty?"
- assertVisible: "(?s).*Uncommitted changes.*"
- takeScreenshot: d2-confirm
- tapOn: Cancel
- assertVisible:
    id: home__worktree-alpha-del-dirty
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: expect-worktree?repo=alpha&name=del-dirty&present=1&file=unsaved.txt
- longPressOn:
    id: home__worktree-alpha-del-dirty
- tapOn: Delete worktree
- tapOn: Delete anyway
- extendedWaitUntil:
    notVisible:
      id: home__worktree-alpha-del-dirty
    timeout: 20000
- takeScreenshot: d2-gone
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: expect-worktree?repo=alpha&name=del-dirty&present=0
