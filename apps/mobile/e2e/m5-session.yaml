# S5: Stop ends a running turn; picking another model in the sheet shows in the header and in
# the hub's session state.
appId: app.getband.mobile
name: S5 stop and change the model
---
- runFlow: subflows/pair-link.yaml
- runFlow:
    file: subflows/open-gamma.yaml
    env:
      WT: gamma-session
- tapOn:
    id: composer__input
- inputText: "work until I stop you"
# The first keyboard use on a simulator shows a one-time "slide to type" notice.
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    id: composer__send
- extendedWaitUntil:
    visible:
      id: composer__stop
    timeout: 15000
- takeScreenshot: m5-running
- tapOn:
    id: composer__stop
- extendedWaitUntil:
    notVisible:
      id: composer__stop
    timeout: 15000
- takeScreenshot: m5-stopped
# The model and mode pills sit in the composer once it is focused.
- tapOn:
    id: composer__input
- assertVisible:
    id: chat__model
- tapOn:
    id: chat__model
- extendedWaitUntil:
    visible:
      id: session-sheet
    timeout: 5000
- takeScreenshot: m5-sheet
- tapOn:
    id: session-sheet__model-stub-large
- extendedWaitUntil:
    notVisible:
      id: session-sheet__pending
    timeout: 20000
- tapOn:
    id: session-sheet__done
- assertVisible: "Model: Stub Large"
- takeScreenshot: m5-model-changed
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: expect-model?wt=gamma-session
      VALUE: "stub-large"
