# Shows the chat tab CHAT through the tab switcher sheet. The strip keeps the shown tab in view,
# so with several tabs another one can be scrolled off the screen.
appId: app.getband.mobile
---
- tapOn:
    id: tabs__switcher
- extendedWaitUntil:
    visible:
      id: tabs__sheet-tab-${CHAT}
    timeout: 5000
- tapOn:
    id: tabs__sheet-tab-${CHAT}
- extendedWaitUntil:
    notVisible:
      id: tabs__sheet
    timeout: 5000
