# Starts the app with no saved hub and pairs with the throwaway hub through the deep link.
appId: app.getband.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true
# A deep-link prompt left over from an earlier failed run stays on screen across launches.
- tapOn:
    text: Cancel
    optional: true
- extendedWaitUntil:
    visible:
      id: connect__screen
    timeout: 20000
- openLink: ${PAIR_LINK}
# iOS asks "Open in “Band”?" for a custom scheme opened from outside the app.
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible:
      id: pair__host
    timeout: 20000
- tapOn:
    id: pair__connect
- extendedWaitUntil:
    visible:
      id: home__status
      text: Connected
    timeout: 20000
