# S1: the home screen lists the hub's repos with their worktrees, branch and host, a Pinned
# section first, and lists them under their repos while the hub defines no group.
appId: app.getband.mobile
name: S1 repos and worktrees on the home screen
---
- runFlow: subflows/pair-link.yaml
- extendedWaitUntil:
    visible:
      id: home__repo-alpha
    timeout: 20000
- assertVisible:
    id: home__repo-beta
# alpha-feat-mobile is pinned, so it sits in the Pinned section.
- assertVisible:
    text: Pinned
- assertVisible:
    id: home__worktree-alpha-main
    text: ".*main.*main.*This hub.*"
- assertVisible:
    id: home__worktree-alpha-feat-mobile
    text: ".*feat/mobile.*This hub.*"
- assertVisible:
    id: home__worktree-beta-main
    text: ".*main.*This hub.*"
# No agent runs yet: every row shows the faint idle dot, and only the root has the star.
- assertVisible:
    id: home__state-alpha-feat-mobile
    text: "No agent activity"
- assertVisible:
    id: home__state-alpha-main
    text: "No agent activity"
- assertVisible:
    id: worktree__root-star-alpha-main
- assertVisible:
    id: worktree__root-star-beta-main
- assertNotVisible:
    id: worktree__root-star-alpha-feat-mobile
- takeScreenshot: s1-repos-and-worktrees
# Collapse a repo; the choice is kept after a restart.
- tapOn:
    id: home__repo-beta
- assertNotVisible:
    id: home__worktree-beta-main
- takeScreenshot: s1-beta-collapsed
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: home__repo-beta
    timeout: 20000
- assertNotVisible:
    id: home__worktree-beta-main
- assertVisible:
    id: home__worktree-alpha-main
- takeScreenshot: s1-collapsed-after-restart
- tapOn:
    id: home__repo-beta
- assertVisible:
    id: home__worktree-beta-main
# Search by branch narrows the list.
- tapOn:
    id: home__search-toggle
- tapOn:
    id: home__search
- inputText: feat/mobile
- assertVisible:
    id: home__worktree-alpha-feat-mobile
- assertNotVisible:
    id: home__worktree-beta-main
- takeScreenshot: s1-search
