# S1: the home screen lists the hub's repos with their worktrees, branch and host.
appId: app.getband.mobile
name: S1 repos and worktrees on the home screen
---
- runFlow: subflows/pair-link.yaml
- extendedWaitUntil:
    visible:
      id: home__repo-alpha
    timeout: 20000
- assertVisible:
    id: home__repo-beta
- assertVisible:
    id: home__worktree-alpha-main
    text: ".*main.*main.*This hub.*"
- assertVisible:
    id: home__worktree-alpha-feat-mobile
    text: ".*feat/mobile.*This hub.*"
- assertVisible:
    id: home__worktree-beta-main
    text: ".*main.*This hub.*"
- takeScreenshot: s1-repos-and-worktrees
# Collapse a repo; the choice is kept after a restart.
- tapOn:
    id: home__repo-beta
- assertNotVisible:
    id: home__worktree-beta-main
- takeScreenshot: s1-beta-collapsed
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: home__repo-beta
    timeout: 20000
- assertNotVisible:
    id: home__worktree-beta-main
- assertVisible:
    id: home__worktree-alpha-main
- takeScreenshot: s1-collapsed-after-restart
- tapOn:
    id: home__repo-beta
- assertVisible:
    id: home__worktree-beta-main
# Search by branch narrows the list.
- tapOn:
    id: home__search
- inputText: feat/mobile
- assertVisible:
    id: home__worktree-alpha-feat-mobile
- assertNotVisible:
    id: home__worktree-beta-main
- takeScreenshot: s1-search
