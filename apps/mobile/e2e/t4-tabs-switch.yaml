# t4 (S4): switching back to a tab shown a moment ago shows its content at once, with no loading
# spinner, at the place the user scrolled to.
appId: app.getband.mobile
name: t4 switching tabs keeps content and scroll position
---
- runFlow: subflows/pair-link.yaml
- runFlow:
    file: subflows/open-gamma.yaml
    env:
      WT: gamma-tabs
- extendedWaitUntil:
    visible:
      id: tabs__switcher
    timeout: 15000
- runFlow:
    file: subflows/select-tab.yaml
    env:
      CHAT: chat_tabs_1
- extendedWaitUntil:
    visible:
      text: "parser turn 12"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "parser turn 01"
    direction: UP
    timeout: 30000
- assertNotVisible:
    text: "parser turn 12"
- takeScreenshot: t4-parser-scrolled
- runFlow:
    file: subflows/select-tab.yaml
    env:
      CHAT: chat_tabs_2
- assertNotVisible:
    text: "parser turn 01"
- takeScreenshot: t4-docs
- runFlow:
    file: subflows/select-tab.yaml
    env:
      CHAT: chat_tabs_1
# No wait: the kept chat is on screen at once, still scrolled to its first turn.
- assertNotVisible:
    id: chat__loading
- takeScreenshot: t4-parser-back
- assertVisible:
    text: "parser turn 01"
- assertNotVisible:
    text: "parser turn 12"
