# t7 (S3): a horizontal swipe on the transcript moves to the next or previous tab and the pill's
# "N of M" follows; a drag from the left edge goes back to the worktree list, the system's back swipe. Runs after t1 to t6, so the tabs
# are the one t2 started, Parser v2, Docs and the chat t6 added from the "web".
appId: app.getband.mobile
name: t7 swipe between tabs
---
- runFlow: subflows/pair-link.yaml
- runFlow:
    file: subflows/open-gamma.yaml
    env:
      WT: gamma-tabs
- extendedWaitUntil:
    visible:
      id: tabs__switcher
    timeout: 15000
- runFlow:
    file: subflows/select-tab.yaml
    env:
      CHAT: chat_tabs_1
- extendedWaitUntil:
    visible:
      id: tabs__switcher
      text: ".*2 of 4.*"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: "parser turn 12"
    timeout: 15000
- takeScreenshot: t7-before-swipe
# Swipe left: the next tab.
- swipe:
    start: 85%, 50%
    end: 15%, 50%
- extendedWaitUntil:
    visible:
      id: tabs__switcher
      text: ".*3 of 4.*"
    timeout: 5000
- assertVisible:
    id: "tabs__dot-chat_tabs_2-.*"
- takeScreenshot: t7-after-swipe-left
# Swipe right: back to the previous tab.
- swipe:
    start: 15%, 50%
    end: 85%, 50%
- extendedWaitUntil:
    visible:
      id: tabs__switcher
      text: ".*2 of 4.*"
    timeout: 5000
- takeScreenshot: t7-after-swipe-right
# A drag that starts at the left edge is the system's back swipe, so it must leave the pager alone
# and go back to the worktree list. (An older simulator ignored Maestro's synthetic drag here, which
# is why this once asserted that the tab stayed put.)
- swipe:
    start: 1%, 50%
    end: 70%, 50%
    duration: 400
- extendedWaitUntil:
    visible:
      id: home__screen
    timeout: 5000
- takeScreenshot: t7-edge-drag
