# S10: the home screen's group filter lists the hub's groups and filters the worktree list by
# group. The hub's seeded worktrees go into two groups for this flow, and the groups are removed
# at the end so the other flows see the plain repo list.
appId: app.getband.mobile
name: S10 group filter on the home screen
---
- runFlow: subflows/pair-link.yaml
- extendedWaitUntil:
    visible:
      id: home__repo-alpha
    timeout: 20000
# No groups yet: the home screen has no group filter.
- assertNotVisible:
    id: home__group-filter
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: groups-seed
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: home__group-filter
    timeout: 20000
- assertVisible:
    id: home__group-filter
    text: ".*All.*"
- assertVisible:
    id: home__worktree-alpha-main
- assertVisible:
    id: home__worktree-beta-main
- takeScreenshot: g1-groups-unfiltered
# The filter sheet lists All and both groups.
- tapOn:
    id: home__group-filter
- assertVisible:
    text: Work
- assertVisible:
    text: Home
- takeScreenshot: g1-group-filter-open
- tapOn:
    text: Work
- extendedWaitUntil:
    visible:
      id: home__worktree-alpha-main
    timeout: 10000
- assertVisible:
    id: home__worktree-alpha-feat-mobile
- assertNotVisible:
    id: home__worktree-beta-main
- takeScreenshot: g1-filtered-to-work
# The choice is kept after a restart.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: home__worktree-alpha-main
    timeout: 20000
- assertNotVisible:
    id: home__worktree-beta-main
# Home shows beta-main only.
- tapOn:
    id: home__group-filter
- tapOn:
    text: Home
- extendedWaitUntil:
    visible:
      id: home__worktree-beta-main
    timeout: 10000
- assertNotVisible:
    id: home__worktree-alpha-main
- takeScreenshot: g1-filtered-to-home
# All shows every worktree again.
- tapOn:
    id: home__group-filter
- tapOn:
    text: All
- extendedWaitUntil:
    visible:
      id: home__worktree-alpha-main
    timeout: 10000
- assertVisible:
    id: home__worktree-beta-main
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: groups-clear
