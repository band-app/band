# S1/S4: a tap outside the composer closes the keyboard, and the last message stays visible.
appId: app.getband.mobile
name: M9 tap outside closes the keyboard
---
- runFlow: subflows/pair-link.yaml
- runFlow:
    file: subflows/open-gamma.yaml
    env:
      WT: gamma-main
- extendedWaitUntil:
    visible:
      text: "Done. The tests pass; the README is next."
    timeout: 15000
- tapOn:
    id: composer__input
- assertVisible: "Done. The tests pass; the README is next."
- extendedWaitUntil:
    visible:
      id: chat__model
    timeout: 5000
- takeScreenshot: m9-keyboard-open
- tapOn: "Done. The tests pass; the README is next."
- assertNotVisible:
    id: chat__model
- takeScreenshot: m9-closed-by-message
- tapOn:
    id: composer__input
- extendedWaitUntil:
    visible:
      id: chat__model
    timeout: 5000
- tapOn:
    id: chat__view
    point: "50%,10%"
- takeScreenshot: m9-closed-by-empty-space
- assertNotVisible:
    id: chat__model
- assertVisible: "Done. The tests pass; the README is next."
# A long press with the keyboard open still opens the Copy sheet.
- tapOn:
    id: composer__input
- extendedWaitUntil:
    visible:
      id: chat__model
    timeout: 5000
- longPressOn:
    text: "Done. The tests pass; the README is next."
- assertVisible:
    text: "Copy"
