# S: a video opens in the system player. A tap shows the controls (Pause while it plays), the
# fullscreen button opens the full-screen player, Done returns, and a swipe back from the edge
# leaves the file screen.
appId: app.getband.mobile
name: X6 the video viewer
---
- runFlow: subflows/pair-link.yaml
- runFlow:
    file: subflows/open-view.yaml
    env:
      TARGET: delta-main
      VIEW: Explorer
- extendedWaitUntil:
    visible:
      id: explorer__row-media
    timeout: 15000
- tapOn:
    id: explorer__row-media
- tapOn:
    id: explorer__row-media/clip.mp4
- extendedWaitUntil:
    visible:
      id: file__video
    timeout: 15000
- takeScreenshot: x6-video-opened
# The system controls are drawn by AVKit outside the app's accessibility tree (the hierarchy shows
# only "Video"), so they are driven by position and judged from the screenshots.
# S1: a tap shows the controls; the centre button plays, then pauses.
- tapOn:
    id: file__video
- takeScreenshot: x6-controls
- tapOn:
    point: 50%, 52%
- takeScreenshot: x6-toggled-1
- tapOn:
    point: 50%, 52%
- takeScreenshot: x6-toggled-2
# S2: the top-left button opens fullscreen. The file header is covered, landscape fills the
# screen, and closing it brings the file screen back.
# A tap on the video toggles the controls and one of them may already be showing, so each attempt
# taps the video and then the button; the two taps cover both states within two attempts.
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            visible:
              id: file__back
          commands:
            - tapOn:
                point: 50%, 30%
            - tapOn:
                point: 7%, 16%
            - extendedWaitUntil:
                notVisible:
                  id: file__back
                timeout: 4000
                optional: true
- extendedWaitUntil:
    notVisible:
      id: file__back
    timeout: 8000
- takeScreenshot: x6-fullscreen-portrait
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd
- takeScreenshot: x6-fullscreen-landscape
- setOrientation: PORTRAIT
- waitForAnimationToEnd
- tapOn:
    point: 50%, 50%
- tapOn:
    point: 7%, 8%
- extendedWaitUntil:
    visible:
      id: file__back
    timeout: 5000
- takeScreenshot: x6-after-done
# S3: the system back swipe returns to the explorer.
- swipe:
    start: 1%, 50%
    end: 80%, 50%
- extendedWaitUntil:
    visible:
      id: explorer__row-media/clip.mp4
    timeout: 5000
- takeScreenshot: x6-back
