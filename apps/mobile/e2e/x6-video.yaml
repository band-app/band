# S: a video opens with the app's own controls (play, time, scrubber, duration, skip, full screen).
# Play advances the time, a tap brings the controls back after they hide, Pause stops, skip moves
# the time, Full screen opens the system player and Done returns, and a back swipe leaves the
# screen and stops playback.
appId: app.getband.mobile
name: X6 the video viewer
---
- runFlow: subflows/pair-link.yaml
- runFlow:
    file: subflows/open-view.yaml
    env:
      TARGET: delta-main
      VIEW: Explorer
- extendedWaitUntil:
    visible:
      id: explorer__row-media
    timeout: 15000
- tapOn:
    id: explorer__row-media
- tapOn:
    id: explorer__row-media/clip.mp4
- extendedWaitUntil:
    visible:
      id: file__video
    timeout: 15000
# S1: the controls show on open.
- extendedWaitUntil:
    visible:
      id: file__video-play
    timeout: 10000
- assertVisible:
    id: file__video-time
    text: "0:00"
- assertVisible:
    id: file__video-duration
- assertVisible:
    id: file__video-scrubber
- takeScreenshot: x6-controls-on-open
- tapOn:
    id: file__video-play
- extendedWaitUntil:
    notVisible:
      id: file__video-time
      text: "0:00"
    timeout: 10000
- takeScreenshot: x6-playing
# S4: the controls hide after 3 s of playback and a tap brings them back.
- extendedWaitUntil:
    notVisible:
      id: file__video-play
    timeout: 8000
- takeScreenshot: x6-controls-hidden
# S2: a tap on the video shows them again.
- tapOn:
    id: file__video-surface
- assertVisible:
    id: file__video-play
- tapOn:
    id: file__video-play
- takeScreenshot: x6-paused
# Skip forward moves the time on, skip back moves it back.
- tapOn:
    id: file__video-forward
- takeScreenshot: x6-skip-forward
- tapOn:
    id: file__video-back
- takeScreenshot: x6-skip-back
# Dragging the scrubber seeks.
- swipe:
    from:
      id: file__video-scrubber
    direction: RIGHT
    duration: 400
- takeScreenshot: x6-scrubbed
# S3: Full screen opens the system player; Done returns to the file screen.
- tapOn:
    id: file__video-fullscreen
- extendedWaitUntil:
    notVisible:
      id: file__back
    timeout: 8000
- takeScreenshot: x6-fullscreen
- tapOn:
    point: 50%, 50%
- tapOn:
    point: 7%, 8%
- extendedWaitUntil:
    visible:
      id: file__back
    timeout: 5000
- takeScreenshot: x6-after-done
# S5: the system back swipe returns to the explorer and stops playback.
- swipe:
    start: 1%, 50%
    end: 80%, 50%
- extendedWaitUntil:
    visible:
      id: explorer__row-media/clip.mp4
    timeout: 5000
- takeScreenshot: x6-back
