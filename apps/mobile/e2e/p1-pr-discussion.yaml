# p1 (S1, S2): Checks shows the pull request's conversation comments and review summary, oldest
# first, and its inline threads with file, line and the resolved or outdated label.
appId: app.getband.mobile
name: p1 the discussion of a pull request
---
- runFlow: subflows/pair-link.yaml
- runFlow:
    file: subflows/open-checks.yaml
    env:
      WT: widgets-feat-discussion
- extendedWaitUntil:
    visible:
      id: checks__list
    timeout: 20000
- scrollUntilVisible:
    element:
      id: pr-comments__summary
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: pr-comments__summary
    text: "7, 2 unresolved"
- assertVisible:
    text: "bob .*ago"
- assertVisible:
    text: ".*Can you add a test.*"
- assertVisible:
    text: "carol approved .*ago"
- assertVisible:
    text: ".*Review by Epic PR Reviewer"
- assertVisible:
    text: "Expand Resolved & retired \\(5\\)"
- assertNotVisible:
    text: ".*(<!--|<img|<details>|&amp;|REVIEW_STATE|psc-adversarial).*"
- takeScreenshot: p1-comments-collapsed
- tapOn:
    text: "Expand Resolved & retired \\(5\\)"
- assertVisible:
    text: "Collapse Resolved & retired \\(5\\)"
- assertVisible:
    text: ".*link.*"
- takeScreenshot: p1-comments
- scrollUntilVisible:
    element:
      id: pr-comments__thread-location
      text: "src/parser.ts:12"
    direction: DOWN
    timeout: 20000
- assertVisible:
    text: ".*Why not a.*"
- assertVisible:
    text: ".*insertion order.*"
- scrollUntilVisible:
    element:
      text: "src/lexer.ts:3"
    direction: DOWN
    timeout: 20000
- assertVisible:
    text: ".*src/lexer.ts:3, Resolved"
- assertVisible:
    text: ".*src/old.ts:9, Outdated"
- takeScreenshot: p1-threads
