# R2 (S2): a long press on a worktree row that ends without movement opens the row menu.
appId: app.getband.mobile
name: R2 long press opens the menu
---
- runFlow: subflows/pair-link.yaml
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: make-worktree?repo=alpha&branch=lp-menu
- pressKey: home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: home__repo-alpha
    timeout: 20000
- swipe:
    start: 50%, 30%
    end: 50%, 70%
- extendedWaitUntil:
    visible:
      id: home__worktree-alpha-lp-menu
    timeout: 20000
- longPressOn:
    id: home__worktree-alpha-lp-menu
- assertVisible: Pin
- assertVisible: Delete worktree
- takeScreenshot: r2-menu
