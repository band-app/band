# E1: a file whose default editor is an extension opens in it, in a WebView with the compact
# layout. An edit marks the page dirty, Save writes the file on the hub, and leaving with
# unsaved edits asks first (the page reports its dirty state to the app).
appId: app.getband.mobile
name: E1 open, edit and save in an extension editor
---
- runFlow: subflows/pair-link.yaml
- runFlow:
    file: subflows/open-editor-file.yaml
    env:
      FILE: notes.band-test
- extendedWaitUntil:
    visible:
      id: file__editor-webview
    timeout: 20000
# The page says "ready" once the extension answered the hello; "compact" is the layout Band sent.
- extendedWaitUntil:
    visible: "ready"
    timeout: 30000
- assertVisible: "compact"
- takeScreenshot: e1-compact-clean
- tapOn: "alpha beta gamma.*"
- inputText: " saved-from-phone"
- extendedWaitUntil:
    visible: ".*unsaved changes.*"
    timeout: 10000
- takeScreenshot: e1-dirty
# Back asks before it discards, and Keep editing stays.
- tapOn:
    id: file__back
- extendedWaitUntil:
    visible: "Discard changes?"
    timeout: 5000
- takeScreenshot: e1-discard-prompt
- tapOn: "Keep editing"
- assertVisible:
    id: file__editor-webview
# The unsaved edit is not on the hub yet.
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: expect-file?repo=gamma&name=editor&path=notes.band-test&present=0
      VALUE: saved-from-phone
# The keyboard's accessory bar floats over the page's Save bar; its check closes it.
- tapOn:
    point: 90%,96%
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: sleep?ms=1000
- tapOn: "Save"
- extendedWaitUntil:
    visible: "saved"
    timeout: 15000
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: expect-file?repo=gamma&name=editor&path=notes.band-test
      VALUE: saved-from-phone
- takeScreenshot: e1-saved
# Clean again: Back leaves without a prompt.
- tapOn:
    id: file__back
- extendedWaitUntil:
    visible:
      id: explorer__row-notes.band-test
    timeout: 10000
- assertNotVisible: "Discard changes?"
