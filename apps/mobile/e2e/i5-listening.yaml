# S5: a chat with a subscription shows the listening pill; removing one calls subscriptions.remove.
appId: app.getband.mobile
name: S5 listening pill
---
- runFlow: subflows/pair-link.yaml
- runFlow:
    file: subflows/open-gamma.yaml
    env:
      WT: gamma-listen
- extendedWaitUntil:
    visible:
      id: chat__empty
    timeout: 15000
- assertNotVisible:
    id: listening__pill
# The subscription appears while the chat is open, as an agent's `band subscriptions create` would.
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: subscribe?wt=gamma-listen
- extendedWaitUntil:
    visible:
      id: listening__pill
    timeout: 15000
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: expect-subscriptions?wt=gamma-listen&n=1
- tapOn:
    id: listening__pill
- assertVisible:
    id: listening__list
- assertVisible: ".*Timer.*"
- takeScreenshot: i5-listening-list
- tapOn:
    id: "listening__remove-.*"
- extendedWaitUntil:
    visible:
      id: listening__empty
    timeout: 10000
- runScript:
    file: scripts/hub-control.js
    env:
      ACTION: expect-subscriptions?wt=gamma-listen&n=0
- tapOn:
    id: listening__close
- extendedWaitUntil:
    notVisible:
      id: listening__pill
    timeout: 5000
- takeScreenshot: i5-listening-removed
