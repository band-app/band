# A permission request with a 1,000+ character command keeps its options on screen. The card's body
# scrolls, so the description below the command can still be read.
appId: app.getband.mobile
name: I6 long permission request
---
- runFlow: subflows/pair-link.yaml
- runFlow:
    file: subflows/open-gamma.yaml
    env:
      WT: gamma-permit-long
- tapOn:
    id: composer__input
- inputText: "bigcmd: clean up"
- tapOn:
    id: composer__send
- extendedWaitUntil:
    visible:
      id: request__permission
    timeout: 20000
- assertVisible:
    id: request__option-allow_once
- assertVisible:
    id: request__option-allow_always
- assertVisible:
    id: request__option-reject_once
- takeScreenshot: i6-permission-long-pinned
- scrollUntilVisible:
    element: ".*not held open by any process.*"
    direction: DOWN
    timeout: 10000
    centerElement: false
- takeScreenshot: i6-permission-long-scrolled
- tapOn:
    id: request__option-allow_once
- extendedWaitUntil:
    visible:
      text: "Long permission granted."
    timeout: 20000
