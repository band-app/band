name: Mobile build

on:
  push:
    branches:
      - main
    paths:
      - apps/mobile/**
      - packages/client/**
      - packages/shared/**
      - pnpm-lock.yaml
  workflow_dispatch: {}

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  build_android:
    name: Android preview build
    type: build
    params:
      platform: android
      profile: preview

  build_ios:
    name: iOS production build
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to TestFlight
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
